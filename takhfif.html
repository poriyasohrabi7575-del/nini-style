<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<title>تخفیف‌ها | نی نی استایل</title>

<style>

body{
font-family:Tahoma,Arial;
background:#fff;
text-align:center;
}

h1{
color:#ff6fa8;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:40px;
}

.card{
background:white;
border-radius:25px;
box-shadow:0 10px 25px #ddd;
padding:20px;
}

.card img{
width:100%;
border-radius:20px;
}

.discount{
background:#ff6fa8;
color:white;
padding:8px;
border-radius:20px;
display:inline-block;
}

.old{
text-decoration:line-through;
color:#999;
}

.price{
color:#ff6fa8;
font-size:22px;
font-weight:bold;
}

</style>

</head>

<body>

<h1>
🔥 تخفیف‌های ویژه نی نی استایل
</h1>

<div class="products">

<div class="card">

<img src="https://placehold.co/400x400/ffe8f3/ffffff">

<h2>ست دخترانه</h2>

<div class="discount">
۳۰٪ تخفیف
</div>

<p class="old">
۲٬۰۰۰٬۰۰۰ تومان
</p>

<p class="price">
۱٬۴۰۰٬۰۰۰ تومان
</p>

</div>


<div class="card">

<img src="https://placehold.co/400x400/dff5ff/ffffff">

<h2>ست پسرانه</h2>

<div class="discount">
۲۵٪ تخفیف
</div>

<p class="old">
۱٬۸۰۰٬۰۰۰ تومان
</p>

<p class="price">
۱٬۳۵۰٬۰۰۰ تومان
</p>

</div>

</div>

</body>

</html>
