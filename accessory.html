<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>اکسسوری | نی نی استایل</title>

<style>

/* =========================
   RESET
========================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #fff;
  color: #333;
}


/* =========================
   HEADER
========================= */

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 5%;
  background: #fff;
  box-shadow: 0 3px 15px rgba(0, 0, 0, .06);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: #b58ac2;
}

.home-btn {
  text-decoration: none;
  color: #555;
  background: #f5eaf7;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: bold;
}

.cart-btn {
  position: relative;
  border: 0;
  background: #f5eaf7;
  width: 45px;
  height: 45px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 21px;
}

.cart-count {
  position: absolute;
  top: -5px;
  right: -5px;
  background: #b58ac2;
  color: white;
  border-radius: 50%;
  min-width: 19px;
  height: 19px;
  font-size: 11px;
  display: grid;
  place-items: center;
}


/* =========================
   PAGE
========================= */

.page-title {
  text-align: center;
  color: #aa7bb8;
  margin: 35px 0 10px;
}

.page-subtitle {
  text-align: center;
  color: #888;
  margin-bottom: 30px;
}


/* =========================
   PRODUCTS
========================= */

.products {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(250px, 1fr)
  );
  gap: 25px;
  padding: 20px 5% 50px;
  max-width: 1200px;
  margin: auto;
}

.card {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 10px 25px #ddd;
  padding: 18px;
  overflow: hidden;
  transition: .2s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 17px;
  background: #f7eef8;
}

.discount {
  display: inline-block;
  margin-top: 12px;
  background: #f1e2f5;
  color: #a06eaf;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
}

.card h2 {
  font-size: 18px;
  margin: 12px 0;
}

.old {
  color: #999;
  text-decoration: line-through;
  margin: 5px 0;
}

.price {
  color: #aa7bb8;
  font-size: 20px;
  font-weight: bold;
  margin: 8px 0 14px;
}

.buy-btn {
  width: 100%;
  border: 0;
  background: #b58ac2;
  color: #fff;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  font-family: inherit;
  font-weight: bold;
  font-size: 14px;
}

.buy-btn:hover {
  background: #a476b2;
}

.loading,
.empty-products,
.error-products {
  grid-column: 1 / -1;
  text-align: center;
  padding: 70px 20px;
  color: #888;
}

.error-products {
  color: #c55;
}


/* =========================
   VARIANTS
========================= */

.variant-box {
  margin-top: 12px;
  padding: 13px;
  border-radius: 14px;
  background: #faf5fb;
  border: 1px solid #eee0f1;
}

.variant-title {
  font-size: 15px;
  font-weight: bold;
  color: #8d6798;
  margin: 12px 0 8px;
}

.variant-label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  color: #777;
  margin: 8px 0 5px;
}

.variant-options {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.variant-option {
  border: 1px solid #ead7e8;
  background: #fff;
  color: #555;
  border-radius: 13px;
  padding: 10px 15px;
  min-width: 58px;
  cursor: pointer;
  font-family: inherit;
}

.variant-option:hover {
  border-color: #b58ac2;
}

.variant-option.selected {
  background: #f5eaf7;
  border-color: #b58ac2;
  color: #865f9a;
  font-weight: bold;
}

.variant-option.disabled {
  opacity: .4;
  cursor: not-allowed;
  text-decoration: line-through;
}

.stock-info {
  min-height: 24px;
  margin: 10px 0 4px;
  font-size: 12px;
  color: #777;
}

.stock-info.available {
  color: #6c9670;
  font-weight: bold;
}

.stock-info.unavailable {
  color: #c55;
  font-weight: bold;
}


/* =========================
   CART
========================= */

#cart-panel {
  position: fixed;
  inset: 0;
  z-index: 9999;
}

.cart-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .35);
  backdrop-filter: blur(2px);
}

.cart-box {
  position: absolute;
  top: 0;
  right: 0;
  width: min(430px, 92vw);
  height: 100%;
  background: #fff;
  box-shadow: -8px 0 30px rgba(0, 0, 0, .15);
  display: flex;
  flex-direction: column;
  animation: cartOpen .25s ease;
}

@keyframes cartOpen {

  from {
    transform: translateX(100%);
  }

  to {
    transform: translateX(0);
  }

}

.cart-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px;
  border-bottom: 1px solid #f0e8ec;
}

.cart-header h2 {
  margin: 0;
  font-size: 21px;
}

.cart-close {
  border: 0;
  background: #f5eaf7;
  color: #aa7bb8;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 25px;
  cursor: pointer;
}

.cart-items {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #f1eaed;
}

.cart-item img {
  width: 75px;
  height: 75px;
  border-radius: 12px;
  object-fit: cover;
  background: #f7eef8;
}

.cart-item-info {
  flex: 1;
  min-width: 0;
}

.cart-item-info h3 {
  font-size: 14px;
  margin: 0 0 5px;
}

.cart-item-meta {
  color: #888;
  font-size: 11px;
  margin: 4px 0;
}

.cart-item-price {
  color: #aa7bb8;
  font-size: 13px;
  font-weight: 800;
}

.cart-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 8px;
}

.cart-controls button {
  width: 27px;
  height: 27px;
  border: 0;
  border-radius: 8px;
  background: #f5eaf7;
  color: #aa7bb8;
  font-size: 18px;
  cursor: pointer;
}

.cart-controls span {
  min-width: 20px;
  text-align: center;
  font-weight: bold;
}

.cart-remove {
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 17px;
}

.cart-footer {
  padding: 18px;
  border-top: 1px solid #eee;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  margin-bottom: 14px;
}

.cart-total strong {
  color: #aa7bb8;
}

.checkout-btn {
  width: 100%;
  border: 0;
  background: #b58ac2;
  color: white;
  padding: 13px;
  border-radius: 13px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.empty-cart {
  text-align: center;
  padding: 70px 20px;
  color: #888;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  header {
    padding: 15px 4%;
  }

  .logo {
    font-size: 18px;
  }

  .home-btn {
    padding: 9px 12px;
    font-size: 13px;
  }

  .products {
    grid-template-columns: 1fr;
    padding: 20px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo">
    🧸 نی نی استایل
  </div>

  <a
    href="index.html"
    class="home-btn"
  >
    🏠 خانه
  </a>

  <button
    class="cart-btn"
    onclick="openCart()"
    aria-label="سبد خرید"
  >

    🛒

    <span
      class="cart-count"
      id="cart-count"
    >
      0
    </span>

  </button>

</header>


<!-- =========================
     PAGE TITLE
========================= -->

<h1 class="page-title">
  🎀 اکسسوری کودک
</h1>

<p class="page-subtitle">
  اکسسوری‌های زیبا و دوست‌داشتنی برای کوچولوها
</p>


<!-- =========================
     PRODUCTS
========================= -->

<div
  class="products"
  id="products"
>

  <div class="loading">
    در حال دریافت محصولات...
  </div>

</div>


<script>

/* =========================================================
   تنظیمات
========================================================= */

const PRODUCTS_API = "/api/products";

let allProducts = [];

let cartItems = JSON.parse(
  localStorage.getItem("niniCart") || "[]"
);


/* =========================================================
   ابزارهای کمکی
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatPrice(value) {

  return Number(value || 0)
    .toLocaleString("fa-IR");

}


function normalizeText(value) {

  return String(value ?? "")
    .trim()
    .replace(/\u200c/g, "")
    .replace(/\s+/g, " ");

}


function isTrue(value) {

  return (
    value === true ||
    value === "true" ||
    value === 1 ||
    value === "1"
  );

}


/* =========================================================
   تشخیص دسته اکسسوری
========================================================= */

function isAccessoryCategory(category) {

  const value =
    normalizeText(category);

  return (
    value === "اکسسوری" ||
    value === "اکسسوری کودک" ||
    value === "اکسسوری‌ها" ||
    value === "اکسسوری ها"
  );

}


/* =========================================================
   دریافت محصولات
========================================================= */

async function loadProducts() {

  const container =
    document.getElementById("products");

  try {

    container.innerHTML = `
      <div class="loading">
        در حال دریافت محصولات...
      </div>
    `;

    const response =
      await fetch(
        PRODUCTS_API,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "خطا در دریافت محصولات"
      );

    }

    const data =
      await response.json();

    if (Array.isArray(data)) {

      allProducts = data;

    } else if (
      data &&
      Array.isArray(data.products)
    ) {

      allProducts = data.products;

    } else {

      allProducts = [];

    }

    renderAccessories();

  } catch (error) {

    console.error(
      "LOAD PRODUCTS ERROR:",
      error
    );

    container.innerHTML = `
      <div class="error-products">

        ❌ دریافت محصولات با مشکل مواجه شد.

        <br><br>

        لطفاً صفحه را دوباره باز کنید.

      </div>
    `;

  }

}


/* =========================================================
   محصولات اکسسوری
========================================================= */

function getAccessoryProducts() {

  return allProducts.filter(
    product => {

      if (!product) {
        return false;
      }

      /*
        اگر محصول پرفروش باشد،
        از صفحه اکسسوری حذف می‌شود.
      */
      if (isTrue(product.bestSeller)) {
        return false;
      }

      /*
        اگر محصول تخفیف ویژه باشد،
        از صفحه اکسسوری حذف می‌شود.
      */
      if (isTrue(product.isWeeklyDiscount)) {
        return false;
      }

      /*
        اگر هیچ‌کدام از تیک‌ها فعال نباشد،
        محصول در دسته اصلی خودش نمایش داده می‌شود.
      */
      return isAccessoryCategory(
        product.category
      );

    }
  );

}

/* =========================================================
   نرمال‌سازی تنوع‌ها
========================================================= */

function normalizeVariants(product) {

  if (
    !product ||
    !Array.isArray(product.variants)
  ) {

    return [];

  }

  return product.variants
    .map(item => {

      if (!item) {
        return null;
      }

      return {

        color:
          String(
            item.color || ""
          ).trim(),

        size:
          String(
            item.size || ""
          ).trim(),

        stock:
          Math.max(
            0,
            Number(item.stock || 0)
          )

      };

    })
    .filter(item => item);

}


/* =========================================================
   رنگ‌ها
========================================================= */

function getColors(variants) {

  return [
    ...new Set(
      variants
        .map(item => item.color)
        .filter(Boolean)
    )
  ];

}


/* =========================================================
   سایزها
========================================================= */

function getSizes(variants) {

  return [
    ...new Set(
      variants
        .map(item => item.size)
        .filter(Boolean)
    )
  ];

}


/* =========================================================
   پیدا کردن تنوع
========================================================= */

function getSelectedVariant(
  variants,
  color,
  size
) {

  if (!variants.length) {
    return null;
  }

  return (
    variants.find(item => {

      const colorMatch =
        !color ||
        !item.color ||
        item.color === color;

      const sizeMatch =
        !size ||
        !item.size ||
        item.size === size;

      return colorMatch && sizeMatch;

    }) || null
  );

}


/* =========================================================
   ساخت کارت محصول
========================================================= */

function createProductCard(product) {

  const id =
    String(
      product.id ||
      product._id ||
      Math.random()
    );

  const name =
    escapeHtml(
      product.name || "محصول"
    );

  const image =
    escapeHtml(
      product.image ||
      "https://placehold.co/500x600/f3e1f7/ffffff?text=اکسسوری"
    );

  const price =
    Number(product.price || 0);

  const oldPrice =
    Number(product.oldPrice || 0);

  const variants =
    normalizeVariants(product);

  const colors =
    getColors(variants);

  const sizes =
    getSizes(variants);

  const hasVariants =
    variants.length > 0;


  /* =========================
     تخفیف
  ========================= */

  let discountHtml = "";

  if (
    oldPrice > price &&
    price > 0
  ) {

    const discountPercent =
      Math.round(
        (
          (oldPrice - price) /
          oldPrice
        ) * 100
      );

    discountHtml = `
      <div class="discount">
        ${discountPercent.toLocaleString("fa-IR")}
        درصد تخفیف
      </div>
    `;

  }


  /* =========================
     رنگ و سایز
  ========================= */

  let variantHtml = "";

  if (hasVariants) {

    variantHtml = `

      <div
        class="variant-box"
        id="variant-box-${id}"
      >

        <div class="variant-title">
          🎨 انتخاب مشخصات محصول
        </div>


        ${
          colors.length
          ? `
            <label class="variant-label">
              🎨 رنگ
            </label>

            <div class="variant-options">

              ${colors.map(color => `
                <button
                  type="button"
                  class="variant-option"
                  data-product="${escapeHtml(id)}"
                  data-color="${escapeHtml(color)}"
                  onclick="selectColor('${escapeHtml(id)}','${escapeHtml(color)}')"
                >
                  ${escapeHtml(color)}
                </button>
              `).join("")}

            </div>
          `
          : ""
        }


        ${
          sizes.length
          ? `
            <label class="variant-label">
              📏 سایز
            </label>

            <div class="variant-options">

              ${sizes.map(size => `
                <button
                  type="button"
                  class="variant-option"
                  data-product="${escapeHtml(id)}"
                  data-size="${escapeHtml(size)}"
                  onclick="selectSize('${escapeHtml(id)}','${escapeHtml(size)}')"
                >
                  ${escapeHtml(size)}
                </button>
              `).join("")}

            </div>
          `
          : ""
        }


        <div
          class="stock-info"
          id="stock-${id}"
        >
          مشخصات محصول را انتخاب کنید
        </div>

      </div>

    `;

  }


  return `

    <div
      class="card"
      data-product-id="${escapeHtml(id)}"
    >

      <img
        src="${image}"
        alt="${name}"
        onerror="this.src='https://placehold.co/500x600/f3e1f7/ffffff?text=اکسسوری'"
      >


      ${discountHtml}


      <h2>
        ${name}
      </h2>


      ${
        oldPrice > price
        ? `
          <p class="old">
            ${formatPrice(oldPrice)}
            تومان
          </p>
        `
        : ""
      }


      <p class="price">
        ${formatPrice(price)}
        تومان
      </p>


      ${variantHtml}


      <button
        class="buy-btn"
        onclick="addProductToCart('${escapeHtml(id)}')"
      >
        🛒 افزودن به سبد خرید
      </button>

    </div>

  `;

}


/* =========================================================
   انتخاب رنگ
========================================================= */

function selectColor(id, color) {

  const buttons =
    document.querySelectorAll(
      `[data-product="${CSS.escape(id)}"][data-color]`
    );

  buttons.forEach(button => {

    button.classList.remove(
      "selected"
    );

    if (
      button.dataset.color === color
    ) {

      button.classList.add(
        "selected"
      );

    }

  });

  updateVariantStock(id);

}


/* =========================================================
   انتخاب سایز
========================================================= */

function selectSize(id, size) {

  const buttons =
    document.querySelectorAll(
      `[data-product="${CSS.escape(id)}"][data-size]`
    );

  buttons.forEach(button => {

    button.classList.remove(
      "selected"
    );

    if (
      button.dataset.size === size
    ) {

      button.classList.add(
        "selected"
      );

    }

  });

  updateVariantStock(id);

}


/* =========================================================
   دریافت انتخاب فعلی
========================================================= */

function getCurrentSelection(id) {

  const colorButton =
    document.querySelector(
      `[data-product="${CSS.escape(id)}"][data-color].selected`
    );

  const sizeButton =
    document.querySelector(
      `[data-product="${CSS.escape(id)}"][data-size].selected`
    );

  return {

    color:
      colorButton
        ? colorButton.dataset.color
        : "",

    size:
      sizeButton
        ? sizeButton.dataset.size
        : ""

  };

}


/* =========================================================
   آپدیت موجودی
========================================================= */

function updateVariantStock(id) {

  const product =
    allProducts.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if (!product) {
    return;
  }

  const variants =
    normalizeVariants(product);

  const stockElement =
    document.getElementById(
      "stock-" + id
    );

  if (!stockElement) {
    return;
  }

  const selection =
    getCurrentSelection(id);

  const color =
    selection.color;

  const size =
    selection.size;


  if (!color && !size) {

    stockElement.textContent =
      "مشخصات محصول را انتخاب کنید";

    stockElement.className =
      "stock-info";

    return;

  }


  const variant =
    getSelectedVariant(
      variants,
      color,
      size
    );


  if (!variant) {

    stockElement.textContent =
      "این ترکیب موجود نیست";

    stockElement.className =
      "stock-info unavailable";

    return;

  }


  if (variant.stock <= 0) {

    stockElement.textContent =
      "ناموجود";

    stockElement.className =
      "stock-info unavailable";

  } else {

    stockElement.textContent =
      "موجودی: " +
      Number(
        variant.stock
      ).toLocaleString("fa-IR") +
      " عدد";

    stockElement.className =
      "stock-info available";

  }

}


/* =========================================================
   نمایش محصولات
========================================================= */

function renderAccessories() {

  const container =
    document.getElementById(
      "products"
    );

  const products =
    getAccessoryProducts();


  if (products.length === 0) {

    container.innerHTML = `

      <div class="empty-products">

        <div style="font-size:48px">
          🎀
        </div>

        <h3>
          هنوز محصولی در اکسسوری ثبت نشده است
        </h3>

        <p>
          محصولات اکسسوری که در پنل مدیریت ثبت شوند،
          اینجا نمایش داده می‌شوند.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    products
      .map(product =>
        createProductCard(product)
      )
      .join("");

}


/* =========================================================
   افزودن محصول به سبد
========================================================= */

function addProductToCart(id) {

  const product =
    allProducts.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!product) {

    alert(
      "محصول پیدا نشد."
    );

    return;

  }


  /*
    اگر محصول پرفروش شده باشد،
    از این صفحه خرید نمی‌شود.
  */

  if (
    isTrue(product.bestSeller)
  ) {

    alert(
      "این محصول در حال حاضر در بخش پرفروش‌ها قرار دارد."
    );

    loadProducts();

    return;

  }


  const variants =
    normalizeVariants(product);


  let selectedColor = "";
  let selectedSize = "";


  if (variants.length) {

    const selection =
      getCurrentSelection(id);

    selectedColor =
      selection.color;

    selectedSize =
      selection.size;


    const colors =
      getColors(variants);

    const sizes =
      getSizes(variants);


    if (
      colors.length &&
      !selectedColor
    ) {

      alert(
        "لطفاً رنگ محصول را انتخاب کنید."
      );

      return;

    }


    if (
      sizes.length &&
      !selectedSize
    ) {

      alert(
        "لطفاً سایز محصول را انتخاب کنید."
      );

      return;

    }

  }


  let selectedVariant = null;


  if (variants.length) {

    selectedVariant =
      getSelectedVariant(
        variants,
        selectedColor,
        selectedSize
      );


    if (!selectedVariant) {

      alert(
        "این ترکیب رنگ و سایز موجود نیست."
      );

      return;

    }


    if (
      Number(
        selectedVariant.stock || 0
      ) <= 0
    ) {

      alert(
        "این محصول در این رنگ و سایز ناموجود است."
      );

      return;

    }

  }


  const cartId =
    [
      product.id,
      selectedColor,
      selectedSize
    ].join("__");


  const existing =
    cartItems.find(
      item =>
        String(item.id) ===
        String(cartId)
    );


  if (existing) {

    if (selectedVariant) {

      const currentQuantity =
        Number(
          existing.quantity || 0
        );


      if (
        currentQuantity >=
        Number(
          selectedVariant.stock || 0
        )
      ) {

        alert(
          "بیشتر از موجودی این محصول نمی‌توانید اضافه کنید."
        );

        return;

      }

    }


    existing.quantity++;

  } else {

    cartItems.push({

      id: cartId,

      productId:
        String(product.id),

      name:
        product.name || "محصول",

      price:
        Number(product.price || 0),

      image:
        product.image || "",

      color:
        selectedColor,

      size:
        selectedSize,

      quantity: 1

    });

  }


  saveCart();


  alert(
    "محصول به سبد خرید اضافه شد 🛒"
  );

}


/* =========================================================
   تعداد سبد
========================================================= */

function updateCartCount() {

  const count =
    cartItems.reduce(
      (total, item) =>
        total +
        Number(
          item.quantity || 0
        ),
      0
    );


  const element =
    document.getElementById(
      "cart-count"
    );


  if (element) {

    element.textContent =
      count.toLocaleString("fa-IR");

  }

}


/* =========================================================
   ذخیره سبد
========================================================= */

function saveCart() {

  localStorage.setItem(
    "niniCart",
    JSON.stringify(cartItems)
  );

  updateCartCount();

}


/* =========================================================
   باز کردن سبد
========================================================= */

function openCart() {

  const old =
    document.getElementById(
      "cart-panel"
    );


  if (old) {
    old.remove();
  }


  const panel =
    document.createElement(
      "div"
    );


  panel.id =
    "cart-panel";


  panel.innerHTML = `

    <div
      class="cart-overlay"
      onclick="closeCart()"
    ></div>


    <div class="cart-box">


      <div class="cart-header">

        <h2>
          🛒 سبد خرید
        </h2>


        <button
          class="cart-close"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>


      <div
        id="cart-items"
        class="cart-items"
      ></div>


      <div class="cart-footer">

        <div class="cart-total">

          <span>
            مبلغ کل:
          </span>


          <strong
            id="cart-total-price"
          >
            ۰ تومان
          </strong>

        </div>


        <button
          class="checkout-btn"
          onclick="checkoutCart()"
        >
          ادامه ثبت سفارش
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(
    panel
  );

  renderCart();

}


/* =========================================================
   بستن سبد
========================================================= */

function closeCart() {

  const panel =
    document.getElementById(
      "cart-panel"
    );


  if (panel) {
    panel.remove();
  }

}


/* =========================================================
   نمایش سبد
========================================================= */

function renderCart() {

  const container =
    document.getElementById(
      "cart-items"
    );


  if (!container) {
    return;
  }


  if (cartItems.length === 0) {

    container.innerHTML = `

      <div class="empty-cart">

        <div style="font-size:42px">
          🛒
        </div>

        <h3>
          سبد خرید خالی است
        </h3>

        <p>
          هنوز محصولی به سبد اضافه نکرده‌اید.
        </p>

      </div>

    `;


    const totalElement =
      document.getElementById(
        "cart-total-price"
      );


    if (totalElement) {

      totalElement.textContent =
        "۰ تومان";

    }

    return;

  }


  container.innerHTML =
    cartItems
      .map(
        item => `

          <div class="cart-item">

            <img
              src="${escapeHtml(item.image || "")}"
              alt="${escapeHtml(item.name || "")}"
              onerror="this.src='https://placehold.co/100x100/f3e1f7/ffffff?text=محصول'"
            >


            <div class="cart-item-info">

              <h3>
                ${escapeHtml(
                  item.name || "محصول"
                )}
              </h3>


              ${
                item.color || item.size
                ? `
                  <div class="cart-item-meta">

                    ${
                      item.color
                      ? "رنگ: " +
                        escapeHtml(
                          item.color
                        )
                      : ""
                    }

                    ${
                      item.color &&
                      item.size
                      ? " | "
                      : ""
                    }

                    ${
                      item.size
                      ? "سایز: " +
                        escapeHtml(
                          item.size
                        )
                      : ""
                    }

                  </div>
                `
                : ""
              }


              <div class="cart-item-price">

                ${formatPrice(
                  item.price
                )}
                تومان

              </div>


              <div class="cart-controls">

                <button
                  onclick="increaseCartItem('${encodeURIComponent(String(item.id))}')"
                >
                  +
                </button>


                <span>
                  ${Number(
                    item.quantity || 0
                  ).toLocaleString("fa-IR")}
                </span>


                <button
                  onclick="decreaseCartItem('${encodeURIComponent(String(item.id))}')"
                >
                  −
                </button>

              </div>

            </div>


            <button
              class="cart-remove"
              onclick="removeCartItem('${encodeURIComponent(String(item.id))}')"
            >
              🗑️
            </button>

          </div>

        `
      )
      .join("");


  const total =
    cartItems.reduce(
      (sum, item) =>
        sum +
        Number(item.price || 0) *
        Number(item.quantity || 0),
      0
    );


  const totalElement =
    document.getElementById(
      "cart-total-price"
    );


  if (totalElement) {

    totalElement.textContent =
      formatPrice(total) +
      " تومان";

  }

}


/* =========================================================
   افزایش تعداد
========================================================= */

function increaseCartItem(
  encodedId
) {

  const id =
    decodeURIComponent(
      encodedId
    );


  const item =
    cartItems.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (item) {

    item.quantity =
      Number(
        item.quantity || 0
      ) + 1;

    saveCart();

    renderCart();

  }

}


/* =========================================================
   کاهش تعداد
========================================================= */

function decreaseCartItem(
  encodedId
) {

  const id =
    decodeURIComponent(
      encodedId
    );


  const item =
    cartItems.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!item) {
    return;
  }


  if (
    Number(
      item.quantity || 0
    ) > 1
  ) {

    item.quantity--;

  } else {

    cartItems =
      cartItems.filter(
        item =>
          String(item.id) !==
          String(id)
      );

  }


  saveCart();

  renderCart();

}


/* =========================================================
   حذف از سبد
========================================================= */

function removeCartItem(
  encodedId
) {

  const id =
    decodeURIComponent(
      encodedId
    );


  cartItems =
    cartItems.filter(
      item =>
        String(item.id) !==
        String(id)
    );


  saveCart();

  renderCart();

}


/* =========================================================
   ادامه سفارش
========================================================= */

function checkoutCart() {

  if (
    cartItems.length === 0
  ) {

    alert(
      "سبد خرید شما خالی است."
    );

    return;

  }


  window.location.href =
    "checkout.html";

}


/* =========================================================
   همگام‌سازی
========================================================= */

window.addEventListener(
  "pageshow",
  function() {

    loadProducts();

  }
);


/* =========================================================
   شروع
========================================================= */

updateCartCount();

loadProducts();

</script>

</body>

</html>
