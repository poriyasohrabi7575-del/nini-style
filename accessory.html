<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اکسسوری | نی نی استایل</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff;
  color:#333;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 5%;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:#b58ac2;
}

.home-btn{
  text-decoration:none;
  color:#555;
  background:#f5eaf7;
  padding:10px 18px;
  border-radius:12px;
  font-weight:bold;
}

.cart-btn{
  position:relative;
  border:0;
  background:#f5eaf7;
  width:45px;
  height:45px;
  border-radius:14px;
  cursor:pointer;
  font-size:21px;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#b58ac2;
  color:white;
  border-radius:50%;
  min-width:19px;
  height:19px;
  font-size:11px;
  display:grid;
  place-items:center;
}

.page-title{
  text-align:center;
  color:#aa7bb8;
  margin:35px 0 10px;
}

.page-subtitle{
  text-align:center;
  color:#888;
  margin-bottom:30px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  padding:20px 5% 50px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:white;
  border-radius:20px;
  box-shadow:0 10px 25px #ddd;
  padding:18px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:17px;
  background:#f7eef8;
}

.discount{
  display:inline-block;
  margin-top:12px;
  background:#f1e2f5;
  color:#a06eaf;
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.card h2{
  font-size:18px;
  margin:12px 0;
}

.old{
  color:#999;
  text-decoration:line-through;
  margin:5px 0;
}

.price{
  color:#aa7bb8;
  font-size:20px;
  font-weight:bold;
  margin:8px 0 14px;
}

.option-title{
  font-size:13px;
  font-weight:bold;
  margin:14px 0 8px;
  color:#555;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.option-btn{
  border:1px solid #ead8ef;
  background:#fff;
  color:#555;
  padding:8px 12px;
  border-radius:9px;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  transition:.2s;
}

.option-btn:hover{
  border-color:#b58ac2;
}

.option-btn.selected{
  background:#f5eaf7;
  border-color:#b58ac2;
  color:#9b6baa;
  font-weight:bold;
}

.buy-btn{
  width:100%;
  border:0;
  background:#b58ac2;
  color:#fff;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-family:inherit;
  font-weight:bold;
  font-size:14px;
  margin-top:16px;
}

.buy-btn:hover{
  background:#a476b2;
}

.buy-btn.disabled{
  background:#ccc;
  cursor:not-allowed;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#888;
  font-size:16px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#888;
}

.error-box{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#b44;
  background:#fff5f5;
  border-radius:18px;
}

/* CART */

#cart-panel{
  position:fixed;
  inset:0;
  z-index:9999;
}

.cart-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(2px);
}

.cart-box{
  position:absolute;
  top:0;
  right:0;
  width:min(430px,92vw);
  height:100%;
  background:#fff;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
  animation:cartOpen .25s ease;
}

@keyframes cartOpen{

  from{
    transform:translateX(100%);
  }

  to{
    transform:translateX(0);
  }

}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #f0e8ec;
}

.cart-header h2{
  margin:0;
  font-size:21px;
}

.cart-close{
  border:0;
  background:#f5eaf7;
  color:#aa7bb8;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:25px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #f1eaed;
}

.cart-item img{
  width:75px;
  height:75px;
  border-radius:12px;
  object-fit:cover;
  background:#f7eef8;
}

.cart-item-info{
  flex:1;
  min-width:0;
}

.cart-item-info h3{
  font-size:14px;
  margin:0 0 5px;
}

.cart-item-price{
  color:#aa7bb8;
  font-size:13px;
  font-weight:800;
}

.cart-item-options{
  color:#777;
  font-size:12px;
  margin-top:5px;
  line-height:1.8;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.cart-controls button{
  width:27px;
  height:27px;
  border:0;
  border-radius:8px;
  background:#f5eaf7;
  color:#aa7bb8;
  font-size:18px;
  cursor:pointer;
}

.cart-controls span{
  min-width:20px;
  text-align:center;
  font-weight:bold;
}

.cart-remove{
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:17px;
}

.cart-footer{
  padding:18px;
  border-top:1px solid #eee;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}

.cart-total strong{
  color:#aa7bb8;
}

.checkout-btn{
  width:100%;
  border:0;
  background:#b58ac2;
  color:white;
  padding:13px;
  border-radius:13px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
}

.empty-cart{
  text-align:center;
  padding:70px 20px;
  color:#888;
}

@media(max-width:600px){

  header{
    padding:15px 4%;
  }

  .logo{
    font-size:18px;
  }

  .products{
    grid-template-columns:1fr;
    padding:20px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🧸 نی نی استایل
  </div>

  <a
    href="index.html"
    class="home-btn"
  >
    🏠 خانه
  </a>

  <button
    class="cart-btn"
    onclick="openCart()"
    aria-label="سبد خرید"
  >

    🛒

    <span
      class="cart-count"
      id="cart-count"
    >
      0
    </span>

  </button>

</header>

<h1 class="page-title">
  🎀 اکسسوری کودک
</h1>

<p class="page-subtitle">
  اکسسوری‌های زیبا و دوست‌داشتنی برای کوچولوها
</p>

<div
  class="products"
  id="products"
>

  <div class="loading">
    ⏳ در حال دریافت محصولات...
  </div>

</div>


<script>

let cartItems = JSON.parse(
  localStorage.getItem('niniCart') || '[]'
);


/* =========================
   محصولات
========================= */

let productsData = [];

let selections = {};


/* =========================
   نرمال‌سازی variants
========================= */

function normalizeVariants(product){

  if(!Array.isArray(product.variants)){
    return [];
  }

  return product.variants
    .map(item => ({

      color:String(item.color || '').trim(),

      size:String(item.size || '').trim(),

      stock:Math.max(
        0,
        Number(item.stock || 0)
      )

    }))
    .filter(item =>
      item.color ||
      item.size
    );

}


/* =========================
   دریافت محصولات از API
========================= */

async function loadProducts(){

  const container =
    document.getElementById('products');

  try{

    const response =
      await fetch(
        '/api/products',
        {
          method:'GET',
          cache:'no-store'
        }
      );

    if(!response.ok){

      throw new Error(
        'خطا در دریافت محصولات'
      );

    }

    const products =
      await response.json();


    /*
      فقط اکسسوری‌هایی که
      پرفروش نیستند نمایش داده شوند
    */

    productsData =
      Array.isArray(products)
        ? products.filter(product => {

            const category =
              String(
                product.category || ''
              ).trim();

            const isBestSeller =
              Boolean(
                product.bestSeller
              );

            return (
              category === 'اکسسوری' &&
              !isBestSeller
            );

          })
        : [];


    renderProducts();


  }catch(error){

    console.error(
      'ACCESSORIES ERROR:',
      error
    );

    container.innerHTML = `

      <div class="error-box">

        ❌ دریافت محصولات با مشکل مواجه شد.

        <br><br>

        لطفاً صفحه را دوباره باز کنید.

      </div>

    `;

  }

}


/* =========================
   نمایش محصولات
========================= */

function renderProducts(){

  const container =
    document.getElementById('products');


  if(productsData.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div style="font-size:48px">
          🎀
        </div>

        <h3>
          هنوز محصولی در اکسسوری ثبت نشده است
        </h3>

        <p>
          محصولات اکسسوری از پنل مدیریت اینجا نمایش داده می‌شوند.
        </p>

      </div>

    `;

    return;

  }


  productsData.forEach(product => {

    selections[product.id] = {

      color:null,

      size:null

    };

  });


  container.innerHTML =
    productsData
      .map(product =>
        createProductCard(product)
      )
      .join('');

}


/* =========================
   ساخت کارت محصول
========================= */

function createProductCard(product){

  const variants =
    normalizeVariants(product);


  const colors =
    [...new Set(
      variants
        .map(v => v.color)
        .filter(Boolean)
    )];


  const sizes =
    [...new Set(
      variants
        .map(v => v.size)
        .filter(Boolean)
    )];


  const price =
    Number(product.price || 0);


  const oldPrice =
    Number(product.oldPrice || 0);


  const hasDiscount =
    oldPrice > price &&
    price > 0;


  const discountPercent =
    hasDiscount
      ? Math.round(
          ((oldPrice - price) / oldPrice) * 100
        )
      : 0;


  let optionsHTML = '';


  if(colors.length > 0){

    optionsHTML += `

      <div class="option-title">
        🎨 انتخاب رنگ
      </div>

      <div class="options">

        ${colors.map(color => `

          <button
            class="option-btn"
            type="button"
            data-product="${escapeHtml(String(product.id))}"
            data-type="color"
            data-value="${escapeHtml(color)}"
            onclick="selectOption(this)"
          >
            ${escapeHtml(color)}
          </button>

        `).join('')}

      </div>

    `;

  }


  if(sizes.length > 0){

    optionsHTML += `

      <div class="option-title">
        📏 انتخاب سایز
      </div>

      <div class="options">

        ${sizes.map(size => `

          <button
            class="option-btn"
            type="button"
            data-product="${escapeHtml(String(product.id))}"
            data-type="size"
            data-value="${escapeHtml(size)}"
            onclick="selectOption(this)"
          >
            ${escapeHtml(size)}
          </button>

        `).join('')}

      </div>

    `;

  }


  const requiresVariant =
    colors.length > 0 ||
    sizes.length > 0;


  let buttonText =
    requiresVariant
      ? '🛒 انتخاب رنگ و سایز'
      : '🛒 افزودن به سبد خرید';


  return `

    <div
      class="card"
      data-card-id="${escapeHtml(String(product.id))}"
    >

      <img
        src="${escapeHtml(product.image || 'https://placehold.co/500x600/f3e1f7/ffffff?text=اکسسوری')}"
        alt="${escapeHtml(product.name || 'محصول اکسسوری')}"
      >


      ${
        hasDiscount
          ? `
            <div class="discount">
              ${discountPercent}٪ تخفیف
            </div>
          `
          : ''
      }


      <h2>
        ${escapeHtml(product.name || 'محصول بدون نام')}
      </h2>


      ${
        hasDiscount
          ? `
            <p class="old">
              ${formatPrice(oldPrice)} تومان
            </p>
          `
          : ''
      }


      <p class="price">
        ${formatPrice(price)} تومان
      </p>


      ${optionsHTML}


      <button
        class="buy-btn ${requiresVariant ? 'disabled' : ''}"
        id="buy-${escapeHtml(String(product.id))}"
        type="button"
        onclick="addProduct('${escapeHtml(String(product.id))}')"
      >
        ${buttonText}
      </button>

    </div>

  `;

}


/* =========================
   انتخاب رنگ / سایز
========================= */

function selectOption(button){

  const productId =
    button.dataset.product;

  const type =
    button.dataset.type;

  const value =
    button.dataset.value;


  const card =
    button.closest('.card');


  const group =
    button.parentElement;


  group
    .querySelectorAll('.option-btn')
    .forEach(btn =>
      btn.classList.remove('selected')
    );


  button.classList.add('selected');


  if(!selections[productId]){

    selections[productId] = {

      color:null,

      size:null

    };

  }


  selections[productId][type] =
    value;


  updateBuyButton(productId);

}


/* =========================
   وضعیت دکمه خرید
========================= */

function updateBuyButton(productId){

  const product =
    productsData.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if(!product){
    return;
  }


  const variants =
    normalizeVariants(product);


  const colors =
    [...new Set(
      variants
        .map(v => v.color)
        .filter(Boolean)
    )];


  const sizes =
    [...new Set(
      variants
        .map(v => v.size)
        .filter(Boolean)
    )];


  const selection =
    selections[productId] || {

      color:null,

      size:null

    };


  const needsColor =
    colors.length > 0;


  const needsSize =
    sizes.length > 0;


  const colorOK =
    !needsColor ||
    Boolean(selection.color);


  const sizeOK =
    !needsSize ||
    Boolean(selection.size);


  const button =
    document.getElementById(
      `buy-${productId}`
    );


  if(!button){
    return;
  }


  if(colorOK && sizeOK){

    button.classList.remove(
      'disabled'
    );

    button.textContent =
      '🛒 افزودن به سبد خرید';

  }else{

    button.classList.add(
      'disabled'
    );

    button.textContent =
      '🛒 انتخاب رنگ و سایز';

  }

}


/* =========================
   افزودن محصول
========================= */

function addProduct(productId){

  const product =
    productsData.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if(!product){
    return;
  }


  const variants =
    normalizeVariants(product);


  const colors =
    [...new Set(
      variants
        .map(v => v.color)
        .filter(Boolean)
    )];


  const sizes =
    [...new Set(
      variants
        .map(v => v.size)
        .filter(Boolean)
    )];


  const selection =
    selections[productId] || {

      color:null,

      size:null

    };


  if(
    (colors.length > 0 && !selection.color) ||
    (sizes.length > 0 && !selection.size)
  ){

    alert(
      'لطفاً رنگ و سایز محصول را انتخاب کنید 🎀'
    );

    return;

  }


  /*
    اگر variants وجود داشته باشد،
    ترکیب انتخاب‌شده را بررسی می‌کنیم.
  */

  if(variants.length > 0){

    const matchingVariant =
      variants.find(variant => {

        const colorMatch =
          !selection.color ||
          variant.color ===
          selection.color;

        const sizeMatch =
          !selection.size ||
          variant.size ===
          selection.size;

        return colorMatch &&
               sizeMatch;

      });


    if(
      matchingVariant &&
      Number(matchingVariant.stock) <= 0
    ){

      alert(
        'این ترکیب رنگ و سایز فعلاً موجود نیست.'
      );

      return;

    }

  }


  const existing =
    cartItems.find(item =>

      String(item.id) ===
      String(product.id) &&

      String(item.color || '') ===
      String(selection.color || '') &&

      String(item.size || '') ===
      String(selection.size || '')

    );


  if(existing){

    existing.quantity =
      Number(existing.quantity || 0) + 1;

  }else{

    cartItems.push({

      id:product.id,

      name:product.name || '',

      price:Number(product.price || 0),

      image:product.image || '',

      color:selection.color || '',

      size:selection.size || '',

      quantity:1

    });

  }


  saveCart();


  alert(
    'محصول با موفقیت به سبد خرید اضافه شد 🛒'
  );

}


/* =========================
   فرمت قیمت
========================= */

function formatPrice(value){

  return Number(value || 0)
    .toLocaleString('fa-IR');

}


/* =========================
   امنیت متن
========================= */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================
   سبد خرید
========================= */

function updateCartCount(){

  const count =
    cartItems.reduce(
      (total,item) =>
        total +
        Number(item.quantity || 0),
      0
    );


  document.getElementById(
    'cart-count'
  ).textContent = count;

}


function saveCart(){

  localStorage.setItem(
    'niniCart',
    JSON.stringify(cartItems)
  );

  updateCartCount();

}


function openCart(){

  const old =
    document.getElementById(
      'cart-panel'
    );


  if(old){
    old.remove();
  }


  const panel =
    document.createElement('div');


  panel.id =
    'cart-panel';


  panel.innerHTML = `

    <div
      class="cart-overlay"
      onclick="closeCart()"
    ></div>


    <div class="cart-box">

      <div class="cart-header">

        <h2>
          🛒 سبد خرید
        </h2>


        <button
          class="cart-close"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>


      <div
        id="cart-items"
        class="cart-items"
      ></div>


      <div class="cart-footer">

        <div class="cart-total">

          <span>
            مبلغ کل:
          </span>

          <strong
            id="cart-total-price"
          >
            ۰ تومان
          </strong>

        </div>


        <button
          class="checkout-btn"
          onclick="checkoutCart()"
        >
          ادامه ثبت سفارش
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(panel);

  renderCart();

}


function closeCart(){

  const panel =
    document.getElementById(
      'cart-panel'
    );


  if(panel){
    panel.remove();
  }

}


function renderCart(){

  const container =
    document.getElementById(
      'cart-items'
    );


  if(!container){
    return;
  }


  if(cartItems.length === 0){

    container.innerHTML = `

      <div class="empty-cart">

        <div style="font-size:42px">
          🛒
        </div>

        <h3>
          سبد خرید خالی است
        </h3>

        <p>
          هنوز محصولی به سبد اضافه نکرده‌اید.
        </p>

      </div>

    `;


    document.getElementById(
      'cart-total-price'
    ).textContent =
      '۰ تومان';


    return;

  }


  container.innerHTML =
    cartItems
      .map(item => `

        <div class="cart-item">

          <img
            src="${escapeHtml(item.image || '')}"
            alt="${escapeHtml(item.name || '')}"
          >


          <div class="cart-item-info">

            <h3>
              ${escapeHtml(item.name || '')}
            </h3>


            ${
              item.color || item.size
                ? `
                  <div class="cart-item-options">

                    ${
                      item.color
                        ? `🎨 رنگ: ${escapeHtml(item.color)}<br>`
                        : ''
                    }

                    ${
                      item.size
                        ? `📏 سایز: ${escapeHtml(item.size)}`
                        : ''
                    }

                  </div>
                `
                : ''
            }


            <div class="cart-item-price">

              ${formatPrice(item.price)}
              تومان

            </div>


            <div class="cart-controls">

              <button
                onclick="increaseCartItem('${escapeHtml(String(item.id))}','${escapeHtml(item.color || '')}','${escapeHtml(item.size || '')}')"
              >
                +
              </button>


              <span>
                ${Number(item.quantity || 0)}
              </span>


              <button
                onclick="decreaseCartItem('${escapeHtml(String(item.id))}','${escapeHtml(item.color || '')}','${escapeHtml(item.size || '')}')"
              >
                −
              </button>

            </div>

          </div>


          <button
            class="cart-remove"
            onclick="removeCartItem('${escapeHtml(String(item.id))}','${escapeHtml(item.color || '')}','${escapeHtml(item.size || '')}')"
          >
            🗑️
          </button>

        </div>

      `)
      .join('');


  const total =
    cartItems.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.quantity || 0),
      0
    );


  document.getElementById(
    'cart-total-price'
  ).textContent =
    formatPrice(total) +
    ' تومان';

}


function increaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(item =>

      String(item.id) ===
      String(id) &&

      String(item.color || '') ===
      String(color || '') &&

      String(item.size || '') ===
      String(size || '')

    );


  if(item){

    item.quantity =
      Number(item.quantity || 0) + 1;

    saveCart();

    renderCart();

  }

}


function decreaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(item =>

      String(item.id) ===
      String(id) &&

      String(item.color || '') ===
      String(color || '') &&

      String(item.size || '') ===
      String(size || '')

    );


  if(!item){
    return;
  }


  if(Number(item.quantity || 0) > 1){

    item.quantity--;

  }else{

    cartItems =
      cartItems.filter(item =>

        !(
          String(item.id) ===
          String(id) &&

          String(item.color || '') ===
          String(color || '') &&

          String(item.size || '') ===
          String(size || '')

        )

      );

  }


  saveCart();

  renderCart();

}


function removeCartItem(
  id,
  color,
  size
){

  cartItems =
    cartItems.filter(item =>

      !(
        String(item.id) ===
        String(id) &&

        String(item.color || '') ===
        String(color || '') &&

        String(item.size || '') ===
        String(size || '')

      )

    );


  saveCart();

  renderCart();

}


/* =========================
   ادامه سفارش
========================= */

function checkoutCart(){

  if(cartItems.length === 0){

    alert(
      'سبد خرید شما خالی است.'
    );

    return;

  }


  window.location.href =
    'checkout.html';

}


/* =========================
   شروع
========================= */

updateCartCount();

loadProducts();

</script>
