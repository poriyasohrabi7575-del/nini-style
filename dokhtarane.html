<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لباس دخترانه | نی نی استایل</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff;
  color:#333;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 5%;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:#e77b9f;
}

.home-btn{
  text-decoration:none;
  color:#555;
  background:#fff0f5;
  padding:10px 18px;
  border-radius:12px;
  font-weight:bold;
}

.cart-btn{
  position:relative;
  border:0;
  background:#fff0f5;
  width:45px;
  height:45px;
  border-radius:14px;
  cursor:pointer;
  font-size:21px;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#ef77a2;
  color:white;
  border-radius:50%;
  min-width:19px;
  height:19px;
  font-size:11px;
  display:grid;
  place-items:center;
}

.page-title{
  text-align:center;
  color:#ff6fa8;
  margin:35px 0 10px;
}

.page-subtitle{
  text-align:center;
  color:#888;
  margin-bottom:30px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  padding:20px 5% 50px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:white;
  border-radius:20px;
  box-shadow:0 10px 25px #ddd;
  padding:18px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:17px;
  background:#f8f3ef;
}

.discount{
  display:inline-block;
  margin-top:12px;
  background:#ffe1eb;
  color:#e76591;
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.card h2{
  font-size:18px;
  margin:12px 0;
}

.old{
  color:#999;
  text-decoration:line-through;
  margin:5px 0;
}

.price{
  color:#ff6fa8;
  font-size:20px;
  font-weight:bold;
  margin:8px 0 14px;
}

.option-title{
  font-size:13px;
  font-weight:bold;
  margin:14px 0 8px;
  color:#555;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.option-btn{
  border:1px solid #ead8df;
  background:#fff;
  color:#555;
  padding:8px 12px;
  border-radius:9px;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  transition:.2s;
}

.option-btn:hover{
  border-color:#ef77a2;
}

.option-btn.selected{
  background:#fff0f5;
  border-color:#ef77a2;
  color:#e76591;
  font-weight:bold;
}

.buy-btn{
  width:100%;
  border:0;
  background:#f27ba4;
  color:#fff;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-family:inherit;
  font-weight:bold;
  font-size:14px;
  margin-top:16px;
}

.buy-btn:hover{
  background:#e96d98;
}

.buy-btn.disabled{
  background:#ccc;
  cursor:not-allowed;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#888;
  font-size:16px;
}

.no-products{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#888;
}

.error-box{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#c55;
  background:#fff5f5;
  border-radius:18px;
}

#cart-panel{
  position:fixed;
  inset:0;
  z-index:9999;
}

.cart-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(2px);
}

.cart-box{
  position:absolute;
  top:0;
  right:0;
  width:min(430px,92vw);
  height:100%;
  background:#fff;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
  animation:cartOpen .25s ease;
}

@keyframes cartOpen{

  from{
    transform:translateX(100%);
  }

  to{
    transform:translateX(0);
  }

}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #f0e8ec;
}

.cart-header h2{
  margin:0;
  font-size:21px;
}

.cart-close{
  border:0;
  background:#fff0f5;
  color:#e76f9b;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:25px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #f1eaed;
}

.cart-item img{
  width:75px;
  height:75px;
  border-radius:12px;
  object-fit:cover;
  background:#f8f3ef;
}

.cart-item-info{
  flex:1;
  min-width:0;
}

.cart-item-info h3{
  font-size:14px;
  margin:0 0 5px;
}

.cart-item-price{
  color:#e76898;
  font-size:13px;
  font-weight:800;
}

.cart-item-options{
  color:#777;
  font-size:12px;
  margin-top:5px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.cart-controls button{
  width:27px;
  height:27px;
  border:0;
  border-radius:8px;
  background:#fff0f5;
  color:#e76f9b;
  font-size:18px;
  cursor:pointer;
}

.cart-controls span{
  min-width:20px;
  text-align:center;
  font-weight:bold;
}

.cart-remove{
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:17px;
}

.cart-footer{
  padding:18px;
  border-top:1px solid #eee;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}

.cart-total strong{
  color:#e76898;
}

.checkout-btn{
  width:100%;
  border:0;
  background:#f27ba4;
  color:white;
  padding:13px;
  border-radius:13px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
}

.empty-cart{
  text-align:center;
  padding:70px 20px;
  color:#888;
}

@media(max-width:600px){

  header{
    padding:15px 4%;
  }

  .logo{
    font-size:18px;
  }

  .products{
    grid-template-columns:1fr;
    padding:20px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🧸 نی نی استایل
  </div>

  <a
    href="index.html"
    class="home-btn"
  >
    🏠 خانه
  </a>

  <button
    class="cart-btn"
    onclick="openCart()"
    aria-label="سبد خرید"
  >
    🛒

    <span
      class="cart-count"
      id="cart-count"
    >
      0
    </span>

  </button>

</header>

<h1 class="page-title">
  👧 لباس دخترانه
</h1>

<p class="page-subtitle">
  جدیدترین لباس‌های دخترانه نی نی استایل
</p>

<div
  class="products"
  id="products"
>

  <div class="loading">
    در حال دریافت محصولات... 🎀
  </div>

</div>


<script>

/* =========================
   سبد خرید
========================= */

let cartItems = JSON.parse(
  localStorage.getItem('niniCart') || '[]'
);


/* =========================
   محصولات
========================= */

let productsList = [];


/* انتخاب‌های محصول */

const selections = {};


/* =========================
   دریافت محصولات از API
========================= */

async function loadProducts(){

  const container =
    document.getElementById('products');

  container.innerHTML = `
    <div class="loading">
      در حال دریافت محصولات... 🎀
    </div>
  `;

  try{

    const response =
      await fetch('/api/products', {
        method:'GET',
        cache:'no-store'
      });


    if(!response.ok){

      throw new Error(
        'خطا در دریافت محصولات: ' +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      API ممکن است مستقیماً آرایه
      یا داخل products آرایه برگرداند.
    */

    if(Array.isArray(data)){

      productsList = data;

    }else if(Array.isArray(data.products)){

      productsList = data.products;

    }else if(Array.isArray(data.data)){

      productsList = data.data;

    }else{

      productsList = [];

    }


    /*
      فقط محصولات لباس دخترانه
      نمایش داده شوند.
    */

    productsList =
      productsList.filter(product => {

        const category =
          String(
            product.category ||
            product.categoryName ||
            ''
          ).trim();

        return normalizeText(category)
          === normalizeText('لباس دخترانه');

      });


    renderProducts();

  }catch(error){

    console.error(
      'Products loading error:',
      error
    );

    container.innerHTML = `
      <div class="error-box">

        <h3>
          دریافت محصولات با مشکل مواجه شد
        </h3>

        <p>
          لطفاً صفحه را دوباره باز کنید.
        </p>

      </div>
    `;

  }

}


/* =========================
   نرمال‌سازی متن فارسی
========================= */

function normalizeText(text){

  return String(text || '')
    .trim()
    .replace(/ي/g,'ی')
    .replace(/ى/g,'ی')
    .replace(/ك/g,'ک')
    .replace(/\u200c/g,' ')
    .replace(/\s+/g,' ');

}


/* =========================
   استخراج قیمت
========================= */

function getProductPrice(product){

  return Number(
    product.price ??
    product.salePrice ??
    product.finalPrice ??
    0
  ) || 0;

}


/* =========================
   استخراج قیمت قبلی
========================= */

function getOldPrice(product){

  return Number(
    product.oldPrice ??
    product.originalPrice ??
    product.comparePrice ??
    0
  ) || 0;

}


/* =========================
   استخراج تصویر
========================= */

function getProductImage(product){

  if(product.image){
    return product.image;
  }

  if(product.imageUrl){
    return product.imageUrl;
  }

  if(Array.isArray(product.images) &&
     product.images.length){

    return product.images[0];

  }

  return 'https://placehold.co/500x600/f8bbd9/ffffff?text=لباس+دخترانه';

}


/* =========================
   استخراج واریانت‌ها
========================= */

function normalizeVariants(product){

  let variants =
    product.variants;


  if(!Array.isArray(variants)){
    return [];
  }


  return variants.map((variant,index) => {

    return {

      id:
        variant.id ||
        `${product.id || index}-${index}`,

      color:
        variant.color ||
        variant.colour ||
        '',

      size:
        variant.size ||
        '',

      stock:
        Number(
          variant.stock ?? 0
        ) || 0

    };

  });

}


/* =========================
   رنگ‌ها
========================= */

function getColors(product){

  const variants =
    normalizeVariants(product);

  return [
    ...new Set(
      variants
        .map(v => v.color)
        .filter(Boolean)
    )
  ];

}


/* =========================
   سایزها
========================= */

function getSizes(product){

  const variants =
    normalizeVariants(product);

  return [
    ...new Set(
      variants
        .map(v => v.size)
        .filter(Boolean)
    )
  ];

}


/* =========================
   ساخت کارت محصول
========================= */

function renderProducts(){

  const container =
    document.getElementById('products');


  if(!productsList.length){

    container.innerHTML = `

      <div class="no-products">

        <div style="font-size:50px">
          👗
        </div>

        <h3>
          هنوز محصولی در این دسته ثبت نشده است
        </h3>

        <p>
          محصولات لباس دخترانه که از پنل مدیریت ثبت می‌کنید،
          اینجا نمایش داده می‌شوند.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    productsList
      .map(product =>
        createProductCard(product)
      )
      .join('');

}


/* =========================
   کارت هر محصول
========================= */

function createProductCard(product){

  const id =
    String(
      product.id ??
      product._id ??
      Date.now()
    );


  if(!selections[id]){

    selections[id] = {
      color:null,
      size:null
    };

  }


  const name =
    product.name ||
    product.title ||
    'محصول دخترانه';


  const price =
    getProductPrice(product);


  const oldPrice =
    getOldPrice(product);


  const image =
    getProductImage(product);


  const variants =
    normalizeVariants(product);


  const colors =
    getColors(product);


  const sizes =
    getSizes(product);


  /*
    اگر محصول واریانت ندارد،
    دکمه مستقیم قابل خرید است.
  */

  const hasVariants =
    variants.length > 0;


  const hasColors =
    colors.length > 0;


  const hasSizes =
    sizes.length > 0;


  let colorHTML = '';


  if(hasColors){

    colorHTML = `

      <div class="option-title">
        🎨 انتخاب رنگ
      </div>

      <div
        class="options"
        data-group="color"
      >

        ${colors.map(color => `

          <button
            type="button"
            class="option-btn"
            onclick="selectOption(
              this,
              '${escapeAttribute(id)}',
              'color',
              '${escapeAttribute(color)}'
            )"
          >
            ${escapeHTML(color)}
          </button>

        `).join('')}

      </div>

    `;

  }


  let sizeHTML = '';


  if(hasSizes){

    sizeHTML = `

      <div class="option-title">
        📏 انتخاب سایز
      </div>

      <div
        class="options"
        data-group="size"
      >

        ${sizes.map(size => `

          <button
            type="button"
            class="option-btn"
            onclick="selectOption(
              this,
              '${escapeAttribute(id)}',
              'size',
              '${escapeAttribute(size)}'
            )"
          >
            ${escapeHTML(size)}
          </button>

        `).join('')}

      </div>

    `;

  }


  let discountHTML = '';


  if(oldPrice > price && price > 0){

    const percent =
      Math.round(
        ((oldPrice - price) / oldPrice) * 100
      );


    discountHTML = `

      <div class="discount">
        ${percent}٪ تخفیف
      </div>

    `;

  }


  let oldPriceHTML = '';


  if(oldPrice > price && oldPrice > 0){

    oldPriceHTML = `

      <p class="old">
        ${formatPrice(oldPrice)} تومان
      </p>

    `;

  }


  let buttonText =
    '🛒 افزودن به سبد خرید';


  let buttonClass =
    'buy-btn';


  if(hasVariants){

    buttonText =
      '🛒 انتخاب رنگ و سایز';

    buttonClass +=
      ' disabled';

  }


  return `

    <div
      class="card"
      data-product-id="${escapeAttribute(id)}"
    >

      <img
        src="${escapeAttribute(image)}"
        alt="${escapeAttribute(name)}"
        loading="lazy"
      >


      ${discountHTML}


      <h2>
        ${escapeHTML(name)}
      </h2>


      ${oldPriceHTML}


      <p class="price">
        ${formatPrice(price)} تومان
      </p>


      ${colorHTML}


      ${sizeHTML}


      <button
        type="button"
        class="${buttonClass}"
        data-product="${escapeAttribute(id)}"
        onclick="addProduct('${escapeAttribute(id)}')"
      >
        ${buttonText}
      </button>

    </div>

  `;

}


/* =========================
   انتخاب رنگ / سایز
========================= */

function selectOption(
  button,
  productId,
  type,
  value
){

  const card =
    button.closest('.card');


  const group =
    button.parentElement;


  group
    .querySelectorAll('.option-btn')
    .forEach(btn =>
      btn.classList.remove('selected')
    );


  button.classList.add('selected');


  if(!selections[productId]){

    selections[productId] = {
      color:null,
      size:null
    };

  }


  selections[productId][type] =
    value;


  updateBuyButton(productId);

}


/* =========================
   بررسی واریانت
========================= */

function findSelectedVariant(product){

  const id =
    String(
      product.id ??
      product._id ??
      ''
    );


  const selection =
    selections[id] || {};


  const variants =
    normalizeVariants(product);


  if(!variants.length){
    return null;
  }


  return variants.find(variant => {

    const colorOK =
      !selection.color ||
      !variant.color ||
      variant.color === selection.color;


    const sizeOK =
      !selection.size ||
      !variant.size ||
      variant.size === selection.size;


    return colorOK && sizeOK;

  }) || null;

}


/* =========================
   فعال کردن دکمه خرید
========================= */

function updateBuyButton(productId){

  const product =
    productsList.find(product =>
      String(
        product.id ??
        product._id ??
        ''
      ) === String(productId)
    );


  if(!product){
    return;
  }


  const button =
    document.querySelector(
      `[data-product="${cssEscape(productId)}"]`
    );


  if(!button){
    return;
  }


  const variants =
    normalizeVariants(product);


  /*
    محصول بدون واریانت:
    مستقیم قابل خرید است.
  */

  if(!variants.length){

    button.classList.remove(
      'disabled'
    );

    button.textContent =
      '🛒 افزودن به سبد خرید';

    return;

  }


  const selection =
    selections[productId] || {};


  const colors =
    getColors(product);


  const sizes =
    getSizes(product);


  const colorRequired =
    colors.length > 0;


  const sizeRequired =
    sizes.length > 0;


  const selectedVariant =
    findSelectedVariant(product);


  const validColor =
    !colorRequired ||
    Boolean(selection.color);


  const validSize =
    !sizeRequired ||
    Boolean(selection.size);


  if(
    validColor &&
    validSize &&
    selectedVariant
  ){

    const stock =
      Number(
        selectedVariant.stock ?? 0
      );


    if(stock <= 0){

      button.classList.add(
        'disabled'
      );

      button.textContent =
        'ناموجود';

      return;

    }


    button.classList.remove(
      'disabled'
    );

    button.textContent =
      '🛒 افزودن به سبد خرید';

  }else{

    button.classList.add(
      'disabled'
    );

    button.textContent =
      '🛒 انتخاب رنگ و سایز';

  }

}


/* =========================
   افزودن به سبد خرید
========================= */

function addProduct(productId){

  const product =
    productsList.find(product =>
      String(
        product.id ??
        product._id ??
        ''
      ) === String(productId)
    );


  if(!product){

    alert(
      'محصول پیدا نشد.'
    );

    return;

  }


  const id =
    String(
      product.id ??
      product._id
    );


  const variants =
    normalizeVariants(product);


  const selection =
    selections[id] || {
      color:null,
      size:null
    };


  /*
    اگر واریانت دارد،
    رنگ و سایز باید انتخاب شوند.
  */

  if(variants.length){

    const colors =
      getColors(product);

    const sizes =
      getSizes(product);


    if(
      colors.length &&
      !selection.color
    ){

      alert(
        'لطفاً رنگ محصول را انتخاب کنید 🎀'
      );

      return;

    }


    if(
      sizes.length &&
      !selection.size
    ){

      alert(
        'لطفاً سایز محصول را انتخاب کنید 🎀'
      );

      return;

    }


    const variant =
      findSelectedVariant(product);


    if(!variant){

      alert(
        'ترکیب انتخاب‌شده برای این محصول موجود نیست.'
      );

      return;

    }


    if(
      Number(variant.stock ?? 0) <= 0
    ){

      alert(
        'این ترکیب فعلاً ناموجود است.'
      );

      return;

    }

  }


  const name =
    product.name ||
    product.title ||
    'محصول دخترانه';


  const price =
    getProductPrice(product);


  const image =
    getProductImage(product);


  const existing =
    cartItems.find(item =>

      String(item.id) === String(id) &&

      String(item.color || '') ===
        String(selection.color || '') &&

      String(item.size || '') ===
        String(selection.size || '')

    );


  if(existing){

    existing.quantity =
      Number(existing.quantity || 0) + 1;

  }else{

    cartItems.push({

      id:id,

      name:name,

      price:price,

      image:image,

      color:
        selection.color || '',

      size:
        selection.size || '',

      quantity:1

    });

  }


  saveCart();


  const optionText =
    selection.color || selection.size
      ? ` با رنگ ${selection.color || '-'} و سایز ${selection.size || '-'}`
      : '';


  alert(
    `محصول${optionText} به سبد خرید اضافه شد 🛒`
  );

}


/* =========================
   سبد خرید
========================= */

function updateCartCount(){

  const count =
    cartItems.reduce(
      (total,item) =>
        total +
        Number(item.quantity || 0),
      0
    );


  document.getElementById(
    'cart-count'
  ).textContent =
    count;

}


function saveCart(){

  localStorage.setItem(
    'niniCart',
    JSON.stringify(cartItems)
  );

  updateCartCount();

}


function formatPrice(value){

  return Number(value || 0)
    .toLocaleString('fa-IR');

}


/* =========================
   باز کردن سبد
========================= */

function openCart(){

  const old =
    document.getElementById(
      'cart-panel'
    );


  if(old){
    old.remove();
  }


  const panel =
    document.createElement('div');


  panel.id =
    'cart-panel';


  panel.innerHTML = `

    <div
      class="cart-overlay"
      onclick="closeCart()"
    ></div>


    <div class="cart-box">

      <div class="cart-header">

        <h2>
          🛒 سبد خرید
        </h2>

        <button
          class="cart-close"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>


      <div
        id="cart-items"
        class="cart-items"
      ></div>


      <div class="cart-footer">

        <div class="cart-total">

          <span>
            مبلغ کل:
          </span>

          <strong
            id="cart-total-price"
          >
            ۰ تومان
          </strong>

        </div>


        <button
          class="checkout-btn"
          onclick="checkoutCart()"
        >

        </button>

  `;


  document.body.appendChild(panel);

/* =========================
   بستن سبد
========================= */

function closeCart(){

  const panel =
    document.getElementById(
      'cart-panel'
    );


  if(panel){
    panel.remove();
  }

}


/* =========================
   نمایش سبد
========================= */

function renderCart(){

  const container =
    document.getElementById(
      'cart-items'
    );


  if(!container){
    return;
  }


  if(cartItems.length === 0){

    container.innerHTML = `

      <div class="empty-cart">

        <div style="font-size:42px">
          🛒
        </div>

        <h3>
          سبد خرید خالی است
        </h3>

        <p>
          هنوز محصولی به سبد اضافه نکرده‌اید.
        </p>

      </div>

    `;


    document.getElementById(
      'cart-total-price'
    ).textContent =
      '۰ تومان';


    return;

  }


  container.innerHTML =
    cartItems.map(item => `

      <div class="cart-item">

        <img
          src="${escapeAttribute(item.image || '')}"
          alt="${escapeAttribute(item.name || '')}"
        >


        <div class="cart-item-info">

          <h3>
            ${escapeHTML(item.name || '')}
          </h3>


          <div class="cart-item-options">

            🎨 رنگ:
            ${escapeHTML(item.color || 'انتخاب نشده')}

            <br>

            📏 سایز:
            ${escapeHTML(item.size || 'انتخاب نشده')}

          </div>


          <div class="cart-item-price">

            ${formatPrice(item.price)}
            تومان

          </div>


          <div class="cart-controls">

            <button
              onclick="increaseCartItem(
                '${escapeAttribute(item.id)}',
                '${escapeAttribute(item.color || '')}',
                '${escapeAttribute(item.size || '')}'
              )"
            >
              +
            </button>


            <span>
              ${Number(item.quantity || 0)}
            </span>


            <button
              onclick="decreaseCartItem(
                '${escapeAttribute(item.id)}',
                '${escapeAttribute(item.color || '')}',
                '${escapeAttribute(item.size || '')}'
              )"
            >
              −
            </button>

          </div>

        </div>


        <button
          class="cart-remove"
          onclick="removeCartItem(
            '${escapeAttribute(item.id)}',
            '${escapeAttribute(item.color || '')}',
            '${escapeAttribute(item.size || '')}'
          )"
        >
          🗑️
        </button>

      </div>

    `).join('');


  const total =
    cartItems.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.quantity || 0),
      0
    );


  document.getElementById(
    'cart-total-price'
  ).textContent =
    formatPrice(total) +
    ' تومان';

}


/* =========================
   افزایش
========================= */

function increaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(item =>

      String(item.id) === String(id) &&

      String(item.color || '') ===
        String(color || '') &&

      String(item.size || '') ===
        String(size || '')

    );


  if(item){

    item.quantity =
      Number(item.quantity || 0) + 1;

    saveCart();

    renderCart();

  }

}


/* =========================
   کاهش
========================= */

function decreaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(item =>

      String(item.id) === String(id) &&

      String(item.color || '') ===
        String(color || '') &&

      String(item.size || '') ===
        String(size || '')

    );


  if(!item){
    return;
  }


  if(Number(item.quantity || 0) > 1){

    item.quantity--;

  }else{

    cartItems =
      cartItems.filter(item =>

        !(
          String(item.id) === String(id) &&

          String(item.color || '') ===
            String(color || '') &&

          String(item.size || '') ===
            String(size || '')

        )

      );

  }


  saveCart();

  renderCart();

}


/* =========================
   حذف
========================= */

function removeCartItem(
  id,
  color,
  size
){

  cartItems =
    cartItems.filter(item =>

      !(
        String(item.id) === String(id) &&

        String(item.color || '') ===
          String(color || '') &&

        String(item.size || '') ===
          String(size || '')

      )

    );


  saveCart();

  renderCart();

}


/* =========================
   ثبت سفارش
========================= */

function checkoutCart(){

  if(cartItems.length === 0){

    alert(
      'سبد خرید شما خالی است.'
    );

    return;

  }


  window.location.href =
    'checkout.html';

}


/* =========================
   توابع امنیتی نمایش
========================= */

function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function escapeAttribute(value){

  return escapeHTML(value);

}


function cssEscape(value){

  if(
    window.CSS &&
    typeof window.CSS.escape === 'function'
  ){

    return window.CSS.escape(
      String(value)
    );

  }


  return String(value)
    .replace(/\\/g,'\\\\')
    .replace(/"/g,'\\"');

}


/* =========================
   شروع صفحه
========================= */

updateCartCount();

loadProducts();

</script>
