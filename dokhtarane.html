<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لباس دخترانه | نی نی استایل</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff;
  color:#333;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 5%;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:#e77b9f;
}

.home-btn{
  text-decoration:none;
  color:#555;
  background:#fff0f5;
  padding:10px 18px;
  border-radius:12px;
  font-weight:bold;
}

.cart-btn{
  position:relative;
  border:0;
  background:#fff0f5;
  width:45px;
  height:45px;
  border-radius:14px;
  cursor:pointer;
  font-size:21px;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#ef77a2;
  color:white;
  border-radius:50%;
  min-width:19px;
  height:19px;
  font-size:11px;
  display:grid;
  place-items:center;
}

.page-title{
  text-align:center;
  color:#ff6fa8;
  margin:35px 0 10px;
}

.page-subtitle{
  text-align:center;
  color:#888;
  margin-bottom:30px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  padding:20px 5% 50px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:white;
  border-radius:20px;
  box-shadow:0 10px 25px #ddd;
  padding:18px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:17px;
  background:#f8f3ef;
}

.discount{
  display:inline-block;
  margin-top:12px;
  background:#ffe1eb;
  color:#e76591;
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.card h2{
  font-size:18px;
  margin:12px 0;
}

.old{
  color:#999;
  text-decoration:line-through;
  margin:5px 0;
}

.price{
  color:#ff6fa8;
  font-size:20px;
  font-weight:bold;
  margin:8px 0 14px;
}

.option-title{
  font-size:13px;
  font-weight:bold;
  margin:14px 0 8px;
  color:#555;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.option-btn{
  border:1px solid #ead8df;
  background:#fff;
  color:#555;
  padding:8px 12px;
  border-radius:9px;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  transition:.2s;
}

.option-btn:hover{
  border-color:#ef77a2;
}

.option-btn.selected{
  background:#fff0f5;
  border-color:#ef77a2;
  color:#e76591;
  font-weight:bold;
}

.buy-btn{
  width:100%;
  border:0;
  background:#f27ba4;
  color:#fff;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-family:inherit;
  font-weight:bold;
  font-size:14px;
  margin-top:16px;
}

.buy-btn:hover{
  background:#e96d98;
}

.buy-btn.disabled{
  background:#ccc;
  cursor:not-allowed;
}

/* CART */

#cart-panel{
  position:fixed;
  inset:0;
  z-index:9999;
}

.cart-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(2px);
}

.cart-box{
  position:absolute;
  top:0;
  right:0;
  width:min(430px,92vw);
  height:100%;
  background:#fff;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
  animation:cartOpen .25s ease;
}

@keyframes cartOpen{

  from{
    transform:translateX(100%);
  }

  to{
    transform:translateX(0);
  }

}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #f0e8ec;
}

.cart-header h2{
  margin:0;
  font-size:21px;
}

.cart-close{
  border:0;
  background:#fff0f5;
  color:#e76f9b;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:25px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #f1eaed;
}

.cart-item img{
  width:75px;
  height:75px;
  border-radius:12px;
  object-fit:cover;
  background:#f8f3ef;
}

.cart-item-info{
  flex:1;
  min-width:0;
}

.cart-item-info h3{
  font-size:14px;
  margin:0 0 5px;
}

.cart-item-price{
  color:#e76898;
  font-size:13px;
  font-weight:800;
}

.cart-item-options{
  color:#777;
  font-size:12px;
  margin-top:5px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.cart-controls button{
  width:27px;
  height:27px;
  border:0;
  border-radius:8px;
  background:#fff0f5;
  color:#e76f9b;
  font-size:18px;
  cursor:pointer;
}

.cart-controls span{
  min-width:20px;
  text-align:center;
  font-weight:bold;
}

.cart-remove{
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:17px;
}

.cart-footer{
  padding:18px;
  border-top:1px solid #eee;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}

.cart-total strong{
  color:#e76898;
}

.checkout-btn{
  width:100%;
  border:0;
  background:#f27ba4;
  color:white;
  padding:13px;
  border-radius:13px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
}

.empty-cart{
  text-align:center;
  padding:70px 20px;
  color:#888;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#888;
  font-size:16px;
}

.no-products{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#888;
}

@media(max-width:600px){

  header{
    padding:15px 4%;
  }

  .logo{
    font-size:18px;
  }

  .products{
    grid-template-columns:1fr;
    padding:20px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🧸 نی نی استایل
  </div>

  <a
    href="index.html"
    class="home-btn"
  >
    🏠 خانه
  </a>

  <button
    class="cart-btn"
    onclick="openCart()"
    aria-label="سبد خرید"
  >

    🛒

    <span
      class="cart-count"
      id="cart-count"
    >
      0
    </span>

  </button>

</header>

<h1 class="page-title">
  👧 لباس دخترانه
</h1>

<p class="page-subtitle">
  جدیدترین لباس‌های دخترانه نی نی استایل
</p>

<div
  class="products"
  id="products"
>

  <div class="loading">
    در حال دریافت محصولات...
  </div>

</div>


<!-- =========================
     CART
========================= -->

<script>

let cartItems = JSON.parse(
  localStorage.getItem('niniCart') || '[]'
);


/* =========================
   انتخاب‌های هر محصول
========================= */

const selections = {};


/* =========================
   تبدیل قیمت
========================= */

function formatPrice(value){

  return Number(value || 0)
    .toLocaleString('fa-IR');

}


/* =========================
   نرمال‌سازی واریانت‌ها
========================= */

function normalizeVariants(product){

  if(!Array.isArray(product.variants)){
    return [];
  }

  return product.variants
    .map(item => ({
      color:String(item.color || '').trim(),
      size:String(item.size || '').trim(),
      stock:Math.max(
        0,
        Number(item.stock || 0)
      )
    }))
    .filter(item =>
      item.color ||
      item.size
    );

}


/* =========================
   دریافت محصولات
========================= */

async function loadProducts(){

  const container =
    document.getElementById('products');

  try{

    const response =
      await fetch('/api/products',{
        cache:'no-store'
      });

    if(!response.ok){
      throw new Error(
        'خطا در دریافت محصولات'
      );
    }

    const products =
      await response.json();


    /*
      فقط محصولات دخترانه
      و فقط محصولاتی که پرفروش نیستند
    */

    const filtered =
      products.filter(product => {

        const category =
          String(
            product.category || ''
          ).trim();

        const isBestSeller =
          product.isBestSeller === true;

     
return (
  category === 'لباس دخترانه' &&
  !isBestSeller &&
  product.isWeeklyDiscount !== true
);

    renderProducts(filtered);

  }catch(error){

    console.error(
      'PRODUCT LOAD ERROR:',
      error
    );

    container.innerHTML = `

      <div class="no-products">

        ❌ دریافت محصولات با مشکل مواجه شد.

        <br><br>

        لطفاً صفحه را دوباره باز کنید.

      </div>

    `;

  }

}


/* =========================
   نمایش محصولات
========================= */

function renderProducts(products){

  const container =
    document.getElementById('products');


  if(!products.length){

    container.innerHTML = `

      <div class="no-products">

        <div style="font-size:45px">
          👗
        </div>

        <h3>
          فعلاً محصولی در این دسته وجود ندارد
        </h3>

        <p>
          محصولات جدید به‌زودی اضافه می‌شوند.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    products.map(product => {

      const id =
        String(product.id);

      const variants =
        normalizeVariants(product);


      const colors =
        [
          ...new Set(
            variants
              .map(v => v.color)
              .filter(Boolean)
          )
        ];


      const sizes =
        [
          ...new Set(
            variants
              .map(v => v.size)
              .filter(Boolean)
          )
        ];


      const oldPrice =
        Number(product.oldPrice || 0);

      const price =
        Number(product.price || 0);


      const hasDiscount =
        oldPrice > price &&
        oldPrice > 0;


      selections[id] = {
        color:null,
        size:null
      };


      return `

        <div
          class="card"
          data-product-id="${escapeHtml(id)}"
        >

          <img
            src="${escapeHtml(product.image || '')}"
            alt="${escapeHtml(product.name || 'محصول')}"
            onerror="this.src='https://placehold.co/500x600/f8f3ef/999999?text=نی+نی+استایل'"
          >

          ${
            hasDiscount
              ? `
                <div class="discount">
                  ${calculateDiscount(oldPrice,price)}٪ تخفیف
                </div>
              `
              : ''
          }

          <h2>
            ${escapeHtml(product.name || 'محصول')}
          </h2>


          ${
            hasDiscount
              ? `
                <p class="old">
                  ${formatPrice(oldPrice)}
                  تومان
                </p>
              `
              : ''
          }


          <p class="price">
            ${formatPrice(price)}
            تومان
          </p>


          ${
            colors.length
              ? `

                <div class="option-title">
                  🎨 انتخاب رنگ
                </div>

                <div class="options">

                  ${colors.map(color => `

                    <button
                      class="option-btn"
                      onclick="selectOption(
                        this,
                        '${escapeJs(id)}',
                        'color',
                        '${escapeJs(color)}'
                      )"
                    >
                      ${escapeHtml(color)}
                    </button>

                  `).join('')}

                </div>

              `
              : ''
          }


          ${
            sizes.length
              ? `

                <div class="option-title">
                  📏 انتخاب سایز
                </div>

                <div class="options">

                  ${sizes.map(size => `

                    <button
                      class="option-btn"
                      onclick="selectOption(
                        this,
                        '${escapeJs(id)}',
                        'size',
                        '${escapeJs(size)}'
                      )"
                    >
                      ${escapeHtml(size)}
                    </button>

                  `).join('')}

                </div>

              `
              : ''
          }


          <button
            class="buy-btn ${
              (
                colors.length &&
                sizes.length
              )
              ? 'disabled'
              : ''
            }"
            data-product="${escapeHtml(id)}"
            onclick="addProduct('${escapeJs(id)}')"
          >
            ${
              colors.length &&
              sizes.length
                ? '🛒 انتخاب رنگ و سایز'
                : '🛒 افزودن به سبد خرید'
            }
          </button>

        </div>

      `;

    }).join('');

}


/* =========================
   انتخاب رنگ / سایز
========================= */

function selectOption(
  button,
  productId,
  type,
  value
){

  const group =
    button.parentElement;


  group
    .querySelectorAll('.option-btn')
    .forEach(btn =>
      btn.classList.remove('selected')
    );


  button.classList.add('selected');


  if(!selections[productId]){

    selections[productId] = {
      color:null,
      size:null
    };

  }


  selections[productId][type] =
    value;


  updateBuyButton(productId);

}


/* =========================
   بررسی واریانت
========================= */

function getSelectedVariant(
  productId
){

  const card =
    document.querySelector(
      `[data-product-id="${CSS.escape(productId)}"]`
    );

  if(!card){
    return null;
  }


  return null;

}


/* =========================
   فعال کردن دکمه خرید
========================= */

function updateBuyButton(productId){

  const selection =
    selections[productId];


  const button =
    document.querySelector(
      `[data-product="${CSS.escape(productId)}"]`
    );


  if(!button){
    return;
  }


  const hasOptions =
    cardHasOptions(productId);


  if(
    !hasOptions ||
    (
      selection &&
      selection.color &&
      selection.size
    )
  ){

    button.classList.remove(
      'disabled'
    );

    button.textContent =
      '🛒 افزودن به سبد خرید';

  }else{

    button.classList.add(
      'disabled'
    );

    button.textContent =
      '🛒 انتخاب رنگ و سایز';

  }

}


/* =========================
   آیا محصول انتخاب لازم دارد؟
========================= */

function cardHasOptions(productId){

  const card =
    document.querySelector(
      `[data-product-id="${CSS.escape(productId)}"]`
    );


  if(!card){
    return false;
  }


  return Boolean(
    card.querySelector(
      '.option-title'
    )
  );

}


/* =========================
   افزودن محصول
========================= */

async function addProduct(productId){

  const selection =
    selections[productId] || {
      color:null,
      size:null
    };


  const card =
    document.querySelector(
      `[data-product-id="${CSS.escape(productId)}"]`
    );


  if(!card){
    return;
  }


  const hasColor =
    card.querySelector(
      '.option-title'
    );


  if(
    hasColor &&
    (
      !selection.color ||
      !selection.size
    )
  ){

    alert(
      'لطفاً رنگ و سایز را انتخاب کنید 🎀'
    );

    return;

  }


  try{

    const response =
      await fetch('/api/products',{
        cache:'no-store'
      });


    if(!response.ok){
      throw new Error();
    }


    const products =
      await response.json();


    const product =
      products.find(item =>
        String(item.id) ===
        String(productId)
      );


    if(!product){

      alert(
        'محصول پیدا نشد.'
      );

      return;

    }


    const existing =
      cartItems.find(item =>
        String(item.id) ===
          String(product.id) &&
        item.color ===
          selection.color &&
        item.size ===
          selection.size
      );


    if(existing){

      existing.quantity++;

    }else{

      cartItems.push({

        id:product.id,

        name:product.name,

        price:Number(product.price) || 0,

        image:product.image || '',

        color:selection.color,

        size:selection.size,

        quantity:1

      });

    }


    saveCart();


    alert(
      `محصول با رنگ ${
        selection.color || 'انتخاب نشده'
      } و سایز ${
        selection.size || 'انتخاب نشده'
      } به سبد خرید اضافه شد 🛒`
    );


  }catch(error){

    console.error(
      'ADD PRODUCT ERROR:',
      error
    );

    alert(
      'افزودن محصول به سبد خرید انجام نشد.'
    );

  }

}


/* =========================
   تعداد سبد
========================= */

function updateCartCount(){

  const count =
    cartItems.reduce(
      (total,item) =>
        total +
        Number(item.quantity || 0),
      0
    );


  document.getElementById(
    'cart-count'
  ).textContent =
    count;

}


/* =========================
   ذخیره سبد
========================= */

function saveCart(){

  localStorage.setItem(
    'niniCart',
    JSON.stringify(cartItems)
  );


  updateCartCount();

}


/* =========================
   باز کردن سبد
========================= */

function openCart(){

  const old =
    document.getElementById(
      'cart-panel'
    );


  if(old){
    old.remove();
  }


  const panel =
    document.createElement('div');


  panel.id =
    'cart-panel';


  panel.innerHTML = `

    <div
      class="cart-overlay"
      onclick="closeCart()"
    ></div>


    <div class="cart-box">

      <div class="cart-header">

        <h2>
          🛒 سبد خرید
        </h2>


        <button
          class="cart-close"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>


      <div
        id="cart-items"
        class="cart-items"
      ></div>


      <div class="cart-footer">

        <div class="cart-total">

          <span>
            مبلغ کل:
          </span>


          <strong
            id="cart-total-price"
          >
            ۰ تومان
          </strong>

        </div>


        <button
          class="checkout-btn"
          onclick="checkoutCart()"
        >
          ادامه ثبت سفارش
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(panel);


  renderCart();

}


/* =========================
   بستن سبد
========================= */

function closeCart(){

  const panel =
    document.getElementById(
      'cart-panel'
    );


  if(panel){
    panel.remove();
  }

}


/* =========================
   نمایش سبد
========================= */

function renderCart(){

  const container =
    document.getElementById(
      'cart-items'
    );


  if(!container){
    return;
  }


  if(cartItems.length === 0){

    container.innerHTML = `

      <div class="empty-cart">

        <div style="font-size:42px">
          🛒
        </div>

        <h3>
          سبد خرید خالی است
        </h3>

        <p>
          هنوز محصولی به سبد اضافه نکرده‌اید.
        </p>

      </div>

    `;


    document.getElementById(
      'cart-total-price'
    ).textContent =
      '۰ تومان';


    return;

  }


  container.innerHTML =
    cartItems.map(item => `

      <div class="cart-item">

        <img
          src="${escapeHtml(item.image || '')}"
          alt="${escapeHtml(item.name || '')}"
        >


        <div class="cart-item-info">

          <h3>
            ${escapeHtml(item.name || '')}
          </h3>


          <div class="cart-item-options">

            🎨 رنگ:
            ${escapeHtml(
              item.color ||
              'انتخاب نشده'
            )}

            <br>

            📏 سایز:
            ${escapeHtml(
              item.size ||
              'انتخاب نشده'
            )}

          </div>


          <div class="cart-item-price">

            ${formatPrice(item.price)}
            تومان

          </div>


          <div class="cart-controls">

            <button
              onclick="increaseCartItem(
                '${escapeJs(String(item.id))}',
                '${escapeJs(item.color || '')}',
                '${escapeJs(item.size || '')}'
              )"
            >
              +
            </button>


            <span>
              ${Number(item.quantity || 0)}
            </span>


            <button
              onclick="decreaseCartItem(
                '${escapeJs(String(item.id))}',
                '${escapeJs(item.color || '')}',
                '${escapeJs(item.size || '')}'
              )"
            >
              −
            </button>

          </div>

        </div>


        <button
          class="cart-remove"
          onclick="removeCartItem(
            '${escapeJs(String(item.id))}',
            '${escapeJs(item.color || '')}',
            '${escapeJs(item.size || '')}'
          )"
        >
          🗑️
        </button>

      </div>

    `).join('');


  const total =
    cartItems.reduce(
      (sum,item) =>
        sum +
        Number(item.price || 0) *
        Number(item.quantity || 0),
      0
    );


  document.getElementById(
    'cart-total-price'
  ).textContent =
    formatPrice(total) +
    ' تومان';

}


/* =========================
   افزایش
========================= */

function increaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(item =>
      String(item.id) ===
        String(id) &&
      item.color === color &&
      item.size === size
    );


  if(item){

    item.quantity++;

    saveCart();

    renderCart();

  }

}


/* =========================
   کاهش
========================= */

function decreaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(item =>
      String(item.id) ===
        String(id) &&
      item.color === color &&
      item.size === size
    );


  if(!item){
    return;
  }


  if(item.quantity > 1){

    item.quantity--;

  }else{

    cartItems =
      cartItems.filter(item =>
        !(
          String(item.id) ===
            String(id) &&
          item.color === color &&
          item.size === size
        )
      );

  }


  saveCart();

  renderCart();

}


/* =========================
   حذف
========================= */

function removeCartItem(
  id,
  color,
  size
){

  cartItems =
    cartItems.filter(item =>
      !(
        String(item.id) ===
          String(id) &&
        item.color === color &&
        item.size === size
      )
    );


  saveCart();

  renderCart();

}


/* =========================
   ثبت سفارش
========================= */

function checkoutCart(){

  if(cartItems.length === 0){

    alert(
      'سبد خرید شما خالی است.'
    );

    return;

  }


  window.location.href =
    'checkout.html';

}


/* =========================
   درصد تخفیف
========================= */

function calculateDiscount(
  oldPrice,
  price
){

  if(
    !oldPrice ||
    oldPrice <= price
  ){
    return 0;
  }


  return Math.round(
    (
      (oldPrice - price) /
      oldPrice
    ) * 100
  );

}


/* =========================
   امنیت نمایش متن
========================= */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================
   امنیت JavaScript
========================= */

function escapeJs(value){

  return String(value ?? '')
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\n/g,'\\n')
    .replace(/\r/g,'\\r');

}


/* =========================
   شروع صفحه
========================= */

updateCartCount();

loadProducts();

</script>
