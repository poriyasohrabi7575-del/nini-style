<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | نی نی استایل</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff8fb;
  color:#444;
}

.header{
  background:#fff;
  padding:20px;
  text-align:center;
  border-bottom:1px solid #f3dce6;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#e88aaa;
}

.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.box{
  background:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

h2{
  margin-top:0;
  color:#e88aaa;
  font-size:21px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ead5df;
  border-radius:10px;
  font-family:inherit;
  font-size:15px;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:#e88aaa;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.order-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px 0;
  border-bottom:1px solid #f1e3e8;
}

.item-info{
  flex:1;
}

.item-name{
  font-weight:bold;
  margin-bottom:6px;
}

.item-price{
  color:#888;
  font-size:14px;
}

.item-total{
  font-weight:bold;
  color:#e88aaa;
  white-space:nowrap;
}

.total{
  display:flex;
  justify-content:space-between;
  margin-top:20px;
  padding-top:18px;
  border-top:2px solid #f1d8e2;
  font-size:19px;
  font-weight:bold;
}

.submit-btn{
  width:100%;
  border:none;
  padding:16px;
  border-radius:12px;
  background:#e88aaa;
  color:#fff;
  font-size:17px;
  font-family:inherit;
  cursor:pointer;
}

.submit-btn:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.back-btn{
  display:block;
  text-align:center;
  margin-top:15px;
  color:#e88aaa;
  text-decoration:none;
}

.empty{
  text-align:center;
  padding:30px;
  color:#888;
}

.success{
  display:none;
  background:#eefaf2;
  color:#287a45;
  border:1px solid #c9ead4;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  text-align:center;
}

/* =========================
   پیگیری سفارش
========================= */

#tracking-box{
  display:none;
  margin-top:15px;
  padding:20px;
  border-radius:15px;
  background:#fff8fb;
  border:1px solid #f1d8e2;
  text-align:center;
}

.tracking-title{
  font-size:20px;
  font-weight:bold;
  color:#e88aaa;
  margin-bottom:12px;
}

#order-number{
  font-size:14px;
  color:#666;
}

#order-status{
  margin-top:15px;
  padding:14px;
  border-radius:10px;
  background:#fff3cd;
  font-weight:bold;
}

#tracking-code-box{
  display:none;
  margin-top:15px;
  padding:14px;
  background:#fff;
  border-radius:10px;
  border:1px solid #ead5df;
}

#customer-received-box{
  display:none;
  margin-top:15px;
}

.received-btn{
  width:100%;
  border:none;
  padding:14px;
  border-radius:12px;
  background:#62b879;
  color:#fff;
  font-size:16px;
  font-family:inherit;
  cursor:pointer;
}

.received-btn:disabled{
  opacity:.7;
  cursor:not-allowed;
}

.received-message{
  display:none;
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#eefaf2;
  color:#287a45;
  font-weight:bold;
}

.tracking-note{
  margin-top:12px;
  font-size:12px;
  color:#888;
}

@media(max-width:600px){

  .container{
    padding:12px;
    margin:15px auto;
  }

  .box{
    padding:18px;
  }

  .order-item{
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<header class="header">
  <div class="logo">
    نی نی استایل 🎀
  </div>
</header>


<main class="container">


<!-- =========================
     اطلاعات مشتری
========================= -->

<div class="box">

<h2>🛍️ اطلاعات سفارش</h2>

<form id="checkout-form">

<div class="form-group">

<label for="name">
نام و نام خانوادگی
</label>

<input
type="text"
id="name"
required
placeholder="مثلاً: پوریا صادقی"
>

</div>


<div class="form-group">

<label for="phone">
شماره موبایل
</label>

<input
type="tel"
id="phone"
required
placeholder="مثلاً: 09123456789"
inputmode="tel"
maxlength="11"
>

</div>


<div class="form-group">

<label for="postalCode">
کد پستی
</label>

<input
type="text"
id="postalCode"
required
placeholder="کد پستی ۱۰ رقمی"
inputmode="numeric"
maxlength="10"
>

</div>


<div class="form-group">

<label for="address">
آدرس کامل
</label>

<textarea
id="address"
required
placeholder="استان، شهر، خیابان، کوچه، پلاک و واحد"
></textarea>

</div>


<button
type="submit"
class="submit-btn"
>
ثبت سفارش 🛒
</button>


<div
id="success-message"
class="success"
>
سفارش شما با موفقیت ثبت شد ❤️
</div>


<!-- =========================
     پیگیری سفارش
========================= -->

<div id="tracking-box">

<div class="tracking-title">
📦 پیگیری سفارش
</div>

<div id="order-number">
کد سفارش
</div>


<div id="order-status">
🟡 سفارش جدید
</div>


<!-- کد رهگیری -->

<div id="tracking-code-box">

<div style="
font-weight:bold;
margin-bottom:7px;
">
📮 کد رهگیری مرسوله
</div>

<div
id="tracking-code"
style="
font-size:18px;
font-weight:bold;
color:#e88aaa;
"
>
-
</div>

</div>


<!-- اعلام دریافت مشتری -->

<div id="customer-received-box">

<button
type="button"
id="received-btn"
class="received-btn"
onclick="customerReceivedOrder()"
>
👤 بسته را تحویل گرفتم
</button>


<div
id="received-message"
class="received-message"
>
✅ دریافت بسته توسط شما ثبت شد.
</div>

</div>


<div class="tracking-note">
وضعیت سفارش به صورت خودکار بروزرسانی می‌شود.
</div>

</div>

</form>

</div>



<!-- =========================
     خلاصه سفارش
========================= -->

<div class="box">

<h2>
📦 خلاصه سفارش
</h2>

<div id="order-items"></div>

<div class="total">

<span>
مبلغ کل
</span>

<span id="order-total">
۰ تومان
</span>

</div>

</div>


<a
href="index.html"
class="back-btn"
>
← بازگشت به فروشگاه
</a>

</main>



<script>


/* =========================
   تنظیمات
========================= */

const CART_KEY = "niniCart";

const ORDER_KEY = "pendingOrder";



/* =========================
   دریافت سبد
========================= */

function getCart(){

try{

const data =
localStorage.getItem(CART_KEY);

if(!data){
return [];
}

const cart =
JSON.parse(data);

return Array.isArray(cart)
? cart
: [];

}catch(error){

console.error(error);

return [];

}

}



/* =========================
   قیمت
========================= */

function getItemPrice(item){

const prices = [

item.price,
item.salePrice,
item.discountPrice,
item.finalPrice,
item.amount

];

for(const value of prices){

if(
value !== undefined &&
value !== null &&
value !== ""
){

const number =
Number(
String(value)
.replace(/,/g,"")
.replace(/٬/g,"")
.replace(/[^\d.]/g,"")
);

if(!isNaN(number)){
return number;
}

}

}

return 0;

}



/* =========================
   تعداد
========================= */

function getItemQuantity(item){

const quantity =
item.quantity ??
item.qty ??
item.count ??
1;

const number =
Number(quantity);

return number > 0
? number
: 1;

}



/* =========================
   نام محصول
========================= */

function getItemName(item){

return(
item.name ||
item.title ||
item.productName ||
"محصول"
);

}



/* =========================
   فرمت قیمت
========================= */

function formatPrice(price){

return(
Number(price || 0)
.toLocaleString("fa-IR")
+
" تومان"
);

}



/* =========================
   نمایش سفارش
========================= */

function renderOrder(){

const cart =
getCart();

const container =
document.getElementById(
"order-items"
);

const totalElement =
document.getElementById(
"order-total"
);


if(!cart.length){

container.innerHTML = `
<div class="empty">
سبد خرید شما خالی است.
</div>
`;

totalElement.textContent =
"۰ تومان";

return;

}


let total = 0;


container.innerHTML =
cart.map(item => {

const name =
getItemName(item);

const price =
getItemPrice(item);

const quantity =
getItemQuantity(item);

const itemTotal =
price * quantity;

total += itemTotal;


return `

<div class="order-item">

<div class="item-info">

<div class="item-name">
${name}
</div>

<div class="item-price">

${formatPrice(price)}

×

${quantity.toLocaleString("fa-IR")}

</div>

</div>


<div class="item-total">

${formatPrice(itemTotal)}

</div>

</div>

`;

}).join("");


totalElement.textContent =
formatPrice(total);

}



/* =========================
   نمایش وضعیت
========================= */

function showOrderStatus(order){

if(!order || !order.id){
return;
}


const box =
document.getElementById(
"tracking-box"
);

const number =
document.getElementById(
"order-number"
);

const status =
document.getElementById(
"order-status"
);

const trackingBox =
document.getElementById(
"tracking-code-box"
);

const trackingCode =
document.getElementById(
"tracking-code"
);

const receivedBox =
document.getElementById(
"customer-received-box"
);

const receivedBtn =
document.getElementById(
"received-btn"
);

const receivedMessage =
document.getElementById(
"received-message"
);


box.style.display =
"block";


number.innerHTML =
"🔢 کد سفارش: <strong>"
+
order.id
+
"</strong>";


const statuses = {

new:{
text:"🟡 سفارش جدید",
bg:"#fff3cd"
},

preparing:{
text:"🔵 در حال آماده‌سازی",
bg:"#e7f1ff"
},

shipped:{
text:"🚚 سفارش ارسال شد",
bg:"#e8f7ff"
},

delivered:{
text:"🟢 سفارش تحویل داده شد",
bg:"#eaf8ee"
}

};


const current =
statuses[
order.status
] || statuses.new;


status.textContent =
current.text;

status.style.background =
current.bg;


/* کد رهگیری */

if(
order.trackingCode
){

trackingBox.style.display =
"block";

trackingCode.textContent =
order.trackingCode;

}else{

trackingBox.style.display =
"none";

}


/* دکمه دریافت */

if(
order.status === "shipped" &&
!order.customerReceived
){

receivedBox.style.display =
"block";

receivedBtn.style.display =
"block";

receivedBtn.disabled =
false;

receivedMessage.style.display =
"none";

}else{

receivedBox.style.display =
"none";

}


/* مشتری قبلاً دریافت را اعلام کرده */

if(
order.customerReceived
){

receivedBox.style.display =
"block";

receivedBtn.style.display =
"none";

receivedMessage.style.display =
"block";

}

}



/* =========================
   دریافت وضعیت از Firebase
========================= */

async function refreshOrderStatus(){

try{

const saved =
localStorage.getItem(
ORDER_KEY
);


if(!saved){
return;
}


const oldOrder =
JSON.parse(saved);


if(!oldOrder.id){
return;
}


const response =
await fetch(
"/api/orders?id="
+
encodeURIComponent(
oldOrder.id
)
);


const result =
await response.json();


if(
response.ok &&
result.success &&
result.order
){

showOrderStatus(
result.order
);


oldOrder.status =
result.order.status ||
"new";


oldOrder.trackingCode =
result.order.trackingCode ||
"";


oldOrder.customerReceived =
result.order.customerReceived ||
false;


localStorage.setItem(
ORDER_KEY,
JSON.stringify(oldOrder)
);

}

}catch(error){

console.error(
"Status error:",
error
);

}

}



/* =========================
   مشتری اعلام دریافت کرد
========================= */

async function customerReceivedOrder(){

try{

const saved =
localStorage.getItem(
ORDER_KEY
);


if(!saved){

alert(
"سفارش قابل شناسایی نیست."
);

return;

}


const order =
JSON.parse(saved);


if(!order.id){

return;

}


const button =
document.getElementById(
"received-btn"
);


button.disabled =
true;

button.textContent =
"در حال ثبت...";


const response =
await fetch(
"/api/orders",
{

method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

id:order.id,

customerReceived:true

})

}
);


const result =
await response.json();


if(
!response.ok ||
!result.success
){

throw new Error(
result.error ||
"خطا در ثبت دریافت"
);

}


/* ذخیره محلی */

order.customerReceived =
true;


localStorage.setItem(
ORDER_KEY,
JSON.stringify(order)
);


/* نمایش پیام */

button.style.display =
"none";


document.getElementById(
"received-message"
).style.display =
"block";


/* دریافت اطلاعات جدید */

refreshOrderStatus();


}catch(error){

console.error(error);


const button =
document.getElementById(
"received-btn"
);

button.disabled =
false;

button.textContent =
"👤 بسته را تحویل گرفتم";


alert(
"ثبت دریافت انجام نشد. لطفاً دوباره تلاش کنید."
);

}

}



/* =========================
   ثبت سفارش
========================= */

document
.getElementById(
"checkout-form"
)
.addEventListener(
"submit",
async function(event){

event.preventDefault();


const cart =
getCart();


if(!cart.length){

alert(
"سبد خرید شما خالی است."
);

return;

}


const name =
document
.getElementById("name")
.value
.trim();


const phone =
document
.getElementById("phone")
.value
.trim();


const postalCode =
document
.getElementById("postalCode")
.value
.trim();


const address =
document
.getElementById("address")
.value
.trim();


if(
!name ||
!phone ||
!postalCode ||
!address
){

alert(
"لطفاً همه اطلاعات را کامل وارد کنید."
);

return;

}


if(
!/^\d{10}$/.test(
postalCode
)
){

alert(
"کد پستی باید دقیقاً ۱۰ رقم باشد."
);

return;

}


let total = 0;

let totalQuantity = 0;


cart.forEach(item => {

const price =
getItemPrice(item);

const quantity =
getItemQuantity(item);


total +=
price * quantity;


totalQuantity +=
quantity;

});


const submitButton =
document.querySelector(
".submit-btn"
);


submitButton.disabled =
true;


submitButton.textContent =
"در حال ثبت سفارش...";


try{

const response =
await fetch(
"/api/orders",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

name:name,

mobile:phone,

postalCode:
postalCode,

address:
address,

products:
cart,

quantity:
totalQuantity,

totalAmount:
total

})

}
);


const result =
await response.json();


if(
!response.ok ||
!result.success
){

throw new Error(
result.error ||
"خطا در ثبت سفارش"
);

}


/* =========================
   ذخیره سفارش
========================= */

const order = {

id:
result.orderId,

status:
"new",

trackingCode:
"",

customerReceived:
false,

customerReceivedAt:
null,

customer:{

name:name,

phone:phone,

postalCode:
postalCode,

address:
address

},

items:
cart,

total:
total,

quantity:
totalQuantity

};


localStorage.setItem(
ORDER_KEY,
JSON.stringify(order)
);


/* پیام موفقیت */

document
.getElementById(
"success-message"
)
.style.display =
"block";


/* نمایش پیگیری */

showOrderStatus(
order
);


/* پاک کردن سبد */

localStorage.removeItem(
CART_KEY
);


submitButton.textContent =
"سفارش با موفقیت ثبت شد ❤️";


submitButton.disabled =
true;


/* دریافت اطلاعات واقعی */

refreshOrderStatus();


}catch(error){

console.error(
"Order error:",
error
);


alert(
"ثبت سفارش انجام نشد. لطفاً دوباره تلاش کنید."
);


submitButton.disabled =
false;


submitButton.textContent =
"ثبت سفارش 🛒";

}

}
);



/* =========================
   اجرای اولیه
========================= */

renderOrder();

refreshOrderStatus();


/* هر ۱۰ ثانیه */

setInterval(
refreshOrderStatus,
10000
);

</script>

</body>
</html>
