  <script>

    /*
      کلید اصلی سبد خرید
    */
    const CART_KEY = "niniCart";


    /*
      خواندن سبد خرید
    */
    function getCart() {

      try {

        const data = localStorage.getItem(CART_KEY);

        if (!data) {
          return [];
        }

        const cart = JSON.parse(data);

        if (Array.isArray(cart)) {
          return cart;
        }

        return [];

      } catch (error) {

        console.error("خطا در خواندن سبد خرید:", error);

        return [];
      }
    }


    /*
      تبدیل قیمت به عدد
    */
    function getItemPrice(item) {

      const possiblePrices = [
        item.price,
        item.salePrice,
        item.discountPrice,
        item.finalPrice,
        item.amount
      ];

      for (const value of possiblePrices) {

        if (
          value !== undefined &&
          value !== null &&
          value !== ""
        ) {

          const number = Number(
            String(value)
              .replace(/,/g, "")
              .replace(/٬/g, "")
              .replace(/[^\d.]/g, "")
          );

          if (!isNaN(number)) {
            return number;
          }
        }
      }

      return 0;
    }


    /*
      تعداد محصول
    */
    function getItemQuantity(item) {

      const quantity =
        item.quantity ??
        item.qty ??
        item.count ??
        1;

      const number = Number(quantity);

      return number > 0 ? number : 1;
    }


    /*
      نام محصول
    */
    function getItemName(item) {

      return (
        item.name ||
        item.title ||
        item.productName ||
        "محصول"
      );
    }


    /*
      فرمت قیمت
    */
    function formatPrice(price) {

      return (
        Number(price || 0).toLocaleString("fa-IR")
        + " تومان"
      );
    }


    /*
      نمایش خلاصه سفارش
    */
    function renderOrder() {

      const cart = getCart();

      const container =
        document.getElementById("order-items");

      const totalElement =
        document.getElementById("order-total");


      /*
        اگر سبد خالی باشد
      */
      if (!cart.length) {

        container.innerHTML = `
          <div class="empty">
            سبد خرید شما خالی است.
          </div>
        `;

        totalElement.textContent = "۰ تومان";

        return;
      }


      let total = 0;


      /*
        ساخت لیست محصولات
      */
      container.innerHTML = cart.map(item => {

        const name = getItemName(item);

        const price = getItemPrice(item);

        const quantity = getItemQuantity(item);

        const itemTotal =
          price * quantity;

        total += itemTotal;


        return `
          <div class="order-item">

            <div class="item-info">

              <div class="item-name">
                ${name}
              </div>

              <div class="item-price">
                ${formatPrice(price)}
                ×
                ${quantity.toLocaleString("fa-IR")}
              </div>

            </div>

            <div class="item-total">
              ${formatPrice(itemTotal)}
            </div>

          </div>
        `;

      }).join("");


      /*
        نمایش مبلغ کل
      */
      totalElement.textContent =
        formatPrice(total);
    }


   /*
  ثبت سفارش
*/
document
  .getElementById("checkout-form")
  .addEventListener("submit", async function (event) {

    event.preventDefault();

    /*
      دریافت سبد
    */
    const cart = getCart();

    /*
      جلوگیری از سفارش بدون محصول
    */
    if (!cart.length) {
      alert("سبد خرید شما خالی است.");
      return;
    }

    /*
      اطلاعات مشتری
    */
    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();

    const postalCode =
      document
        .getElementById("postalCode")
        .value
        .trim();

    const address =
      document
        .getElementById("address")
        .value
        .trim();

    /*
      بررسی اطلاعات
    */
    if (
      !name ||
      !phone ||
      !postalCode ||
      !address
    ) {
      alert("لطفاً همه اطلاعات را کامل وارد کنید.");
      return;
    }

    /*
      بررسی کد پستی
    */
    if (!/^\d{10}$/.test(postalCode)) {
      alert("کد پستی باید دقیقاً ۱۰ رقم باشد.");
      return;
    }

    /*
      محاسبه مبلغ کل
    */
    let total = 0;
    let totalQuantity = 0;

    cart.forEach(item => {

      const price = getItemPrice(item);
      const quantity = getItemQuantity(item);

      total += price * quantity;
      totalQuantity += quantity;

    });

    /*
      دکمه ثبت سفارش
    */
    const submitButton =
      document.querySelector(".submit-btn");

    submitButton.disabled = true;
    submitButton.textContent = "در حال ثبت سفارش...";

    try {

      /*
        ارسال سفارش به Firebase
      */
      const response = await fetch("/api/orders", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          name: name,

          mobile: phone,

          postalCode: postalCode,

          address: address,

          products: cart,

          quantity: totalQuantity,

          totalAmount: total

        })
      });

      const result = await response.json();

      /*
        بررسی نتیجه API
      */
      if (!response.ok || !result.success) {

        throw new Error(
          result.error || "خطا در ثبت سفارش"
        );

      }

      /*
        ذخیره نسخه سفارش در مرورگر
      */
      const order = {

        id: result.orderId,

        customer: {

          name: name,

          phone: phone,

          postalCode: postalCode,

          address: address

        },

        items: cart,

        total: total,

        quantity: totalQuantity

      };

      localStorage.setItem(
        "pendingOrder",
        JSON.stringify(order)
      );

      /*
        نمایش پیام موفقیت
      */
      document
        .getElementById("success-message")
        .style.display = "block";

      /*
        پاک کردن سبد خرید
      */
      localStorage.removeItem(CART_KEY);

      /*
        غیرفعال کردن دکمه
      */
      submitButton.textContent =
        "سفارش با موفقیت ثبت شد ❤️";

      submitButton.disabled = true;

      console.log(
        "Order saved successfully:",
        result
      );

    } catch (error) {

      console.error(
        "Order error:",
        error
      );

      alert(
        "ثبت سفارش انجام نشد. لطفاً دوباره تلاش کنید."
      );

      submitButton.disabled = false;

      submitButton.textContent =
        "ثبت سفارش 🛒";

    }

  });
    renderOrder();

  </script>

</body>
