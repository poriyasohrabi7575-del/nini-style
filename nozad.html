<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لباس نوزاد | نی نی استایل</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:#fff;
  color:#333;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 5%;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:#d8ad68;
}

.home-btn{
  text-decoration:none;
  color:#555;
  background:#fff5df;
  padding:10px 18px;
  border-radius:12px;
  font-weight:bold;
}

.cart-btn{
  position:relative;
  border:0;
  background:#fff5df;
  width:45px;
  height:45px;
  border-radius:14px;
  cursor:pointer;
  font-size:21px;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:#d8ad68;
  color:white;
  border-radius:50%;
  min-width:19px;
  height:19px;
  font-size:11px;
  display:grid;
  place-items:center;
}

.page-title{
  text-align:center;
  color:#d0a45e;
  margin:35px 0 10px;
}

.page-subtitle{
  text-align:center;
  color:#888;
  margin-bottom:30px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  padding:20px 5% 50px;
  max-width:1200px;
  margin:auto;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#999;
  font-size:17px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#999;
}

.card{
  background:white;
  border-radius:20px;
  box-shadow:0 10px 25px #ddd;
  padding:18px;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:17px;
  background:#fff8e9;
}

.discount{
  display:inline-block;
  margin-top:12px;
  background:#fff0d0;
  color:#c4944c;
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.card h2{
  font-size:18px;
  margin:12px 0;
}

.old{
  color:#999;
  text-decoration:line-through;
  margin:5px 0;
}

.price{
  color:#d0a45e;
  font-size:20px;
  font-weight:bold;
  margin:8px 0 14px;
}

.option-title{
  font-size:13px;
  font-weight:bold;
  margin:14px 0 8px;
  color:#555;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.option-btn{
  border:1px solid #eadcc4;
  background:#fff;
  color:#555;
  padding:8px 12px;
  border-radius:9px;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  transition:.2s;
}

.option-btn:hover{
  border-color:#d8ad68;
}

.option-btn.selected{
  background:#fff5df;
  border-color:#d8ad68;
  color:#b88945;
  font-weight:bold;
}

.stock-info{
  margin-top:12px;
  color:#777;
  font-size:12px;
}

.buy-btn{
  width:100%;
  border:0;
  background:#d8ad68;
  color:#fff;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  font-family:inherit;
  font-weight:bold;
  font-size:14px;
  margin-top:16px;
}

.buy-btn:hover{
  background:#c79b57;
}

.buy-btn.disabled{
  background:#ccc;
  cursor:not-allowed;
}

/* CART */

#cart-panel{
  position:fixed;
  inset:0;
  z-index:9999;
}

.cart-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(2px);
}

.cart-box{
  position:absolute;
  top:0;
  right:0;
  width:min(430px,92vw);
  height:100%;
  background:#fff;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);
  display:flex;
  flex-direction:column;
  animation:cartOpen .25s ease;
}

@keyframes cartOpen{

  from{
    transform:translateX(100%);
  }

  to{
    transform:translateX(0);
  }

}

.cart-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #f0e8ec;
}

.cart-header h2{
  margin:0;
  font-size:21px;
}

.cart-close{
  border:0;
  background:#fff5df;
  color:#c99d59;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:25px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.cart-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #f1eaed;
}

.cart-item img{
  width:75px;
  height:75px;
  border-radius:12px;
  object-fit:cover;
  background:#fff8e9;
}

.cart-item-info{
  flex:1;
  min-width:0;
}

.cart-item-info h3{
  font-size:14px;
  margin:0 0 5px;
}

.cart-item-price{
  color:#c99d59;
  font-size:13px;
  font-weight:800;
}

.cart-item-options{
  color:#777;
  font-size:12px;
  margin-top:5px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}

.cart-controls button{
  width:27px;
  height:27px;
  border:0;
  border-radius:8px;
  background:#fff5df;
  color:#c99d59;
  font-size:18px;
  cursor:pointer;
}

.cart-controls span{
  min-width:20px;
  text-align:center;
  font-weight:bold;
}

.cart-remove{
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:17px;
}

.cart-footer{
  padding:18px;
  border-top:1px solid #eee;
}

.cart-total{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}

.cart-total strong{
  color:#c99d59;
}

.checkout-btn{
  width:100%;
  border:0;
  background:#d8ad68;
  color:white;
  padding:13px;
  border-radius:13px;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
}

.empty-cart{
  text-align:center;
  padding:70px 20px;
  color:#888;
}

@media(max-width:600px){

  header{
    padding:15px 4%;
  }

  .logo{
    font-size:18px;
  }

  .products{
    grid-template-columns:1fr;
    padding:20px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    🧸 نی نی استایل
  </div>

  <a
    href="index.html"
    class="home-btn"
  >
    🏠 خانه
  </a>

  <button
    class="cart-btn"
    onclick="openCart()"
    aria-label="سبد خرید"
  >

    🛒

    <span
      class="cart-count"
      id="cart-count"
    >
      0
    </span>

  </button>

</header>

<h1 class="page-title">
  👶 لباس نوزاد
</h1>

<p class="page-subtitle">
  لباس‌های لطیف و دوست‌داشتنی برای کوچولوها
</p>

<div
  class="products"
  id="products"
>

  <div class="loading">
    در حال دریافت محصولات... ⏳
  </div>

</div>


<script>

/* =========================================================
   سبد خرید
========================================================= */

let cartItems = JSON.parse(
  localStorage.getItem('niniCart') || '[]'
);


/* =========================================================
   محصولات
========================================================= */

let productsData = [];

let selections = {};


/* =========================================================
   دریافت محصولات واقعی از API
========================================================= */

async function loadProducts(){

  const container =
    document.getElementById('products');

  try{

    const response =
      await fetch(
        '/api/products',
        {
          method:'GET',
          cache:'no-store'
        }
      );

    if(!response.ok){

      throw new Error(
        'خطا در دریافت محصولات'
      );

    }

    const data =
      await response.json();


    if(!Array.isArray(data)){

      throw new Error(
        'اطلاعات محصولات معتبر نیست'
      );

    }


    /*
      فقط محصولات دسته‌بندی نوزاد
      و فقط محصولاتی که پرفروش نیستند
    */

    productsData =
      data.filter(product => {

        const category =
          String(
            product.category || ''
          ).trim();

       const isBestSeller =
  product.bestSeller === true ||
  product.isBestSeller === true;


const isBestSeller =
  product.bestSeller === true ||
  product.isBestSeller === true;

const isWeeklyOffer =
  product.weeklyOffer === true ||
  product.isWeeklyDiscount === true ||
  product.isWeeklyOffer === true;

const isBaby =
  category === 'لباس نوزاد' ||
  category === 'نوزاد' ||
  category === 'لباس نوزادی' ||
  category.includes('نوزاد');

return (
  isBaby &&
  !isBestSeller &&
  !isWeeklyOffer
);


    renderProducts();

  }catch(error){

    console.error(
      'BABY PRODUCTS ERROR:',
      error
    );

    container.innerHTML = `

      <div class="empty">

        <h3>
          دریافت محصولات انجام نشد ❌
        </h3>

        <p>
          لطفاً صفحه را دوباره باز کنید.
        </p>

      </div>

    `;

  }

}


/* =========================================================
   نمایش محصولات
========================================================= */

function renderProducts(){

  const container =
    document.getElementById('products');


  if(productsData.length === 0){

    container.innerHTML = `

      <div class="empty">

        <div style="font-size:45px">
          👶
        </div>

        <h3>
          فعلاً محصولی در این دسته وجود ندارد
        </h3>

        <p>
          محصولات نوزاد از پنل مدیریت نمایش داده می‌شوند.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    productsData.map(
      product =>
        createProductCard(product)
    ).join('');


  productsData.forEach(product => {

    selections[product.id] = {

      color:null,

      size:null

    };

  });

}


/* =========================================================
   ساخت کارت محصول
========================================================= */

function createProductCard(product){

  const id =
    String(product.id);


  const name =
    escapeHtml(
      product.name || 'محصول نوزاد'
    );


  const image =
    product.image ||
    'https://placehold.co/500x600/fff0c9/ffffff?text=لباس+نوزاد';


  const price =
    Number(product.price || 0);


  const oldPrice =
    Number(product.oldPrice || 0);


  const variants =
    Array.isArray(product.variants)
      ? product.variants
      : [];


  const colors =
    [
      ...new Set(
        variants
          .map(item =>
            String(
              item.color || ''
            ).trim()
          )
          .filter(Boolean)
      )
    ];


  const sizes =
    [
      ...new Set(
        variants
          .map(item =>
            String(
              item.size || ''
            ).trim()
          )
          .filter(Boolean)
      )
    ];


  let html = `

    <div class="card">

      <img
        src="${escapeAttribute(image)}"
        alt="${escapeAttribute(name)}"
      >
  `;


  if(
    oldPrice > 0 &&
    oldPrice > price
  ){

    const discount =
      Math.round(
        (
          (oldPrice - price) /
          oldPrice
        ) * 100
      );

    html += `

      <div class="discount">
        ${discount}٪ تخفیف
      </div>

    `;

  }


  html += `

      <h2>
        ${name}
      </h2>
  `;


  if(
    oldPrice > 0 &&
    oldPrice > price
  ){

    html += `

      <p class="old">
        ${formatPrice(oldPrice)} تومان
      </p>

    `;

  }


  html += `

      <p class="price">
        ${formatPrice(price)} تومان
      </p>
  `;


  /*
    اگر محصول رنگ دارد
  */

  if(colors.length > 0){

    html += `

      <div class="option-title">
        🎨 انتخاب رنگ
      </div>

      <div class="options">

    `;


    colors.forEach(color => {

      html += `

        <button
          class="option-btn"
          onclick="selectOption(
            '${escapeJs(id)}',
            'color',
            '${escapeJs(color)}',
            this
          )"
        >
          ${escapeHtml(color)}
        </button>

      `;

    });


    html += `

      </div>

    `;

  }


  /*
    اگر محصول سایز دارد
  */

  if(sizes.length > 0){

    html += `

      <div class="option-title">
        📏 انتخاب سایز
      </div>

      <div class="options">

    `;


    sizes.forEach(size => {

      html += `

        <button
          class="option-btn"
          onclick="selectOption(
            '${escapeJs(id)}',
            'size',
            '${escapeJs(size)}',
            this
          )"
        >
          ${escapeHtml(size)}
        </button>

      `;

    });


    html += `

      </div>

    `;

  }


  const totalStock =
    variants.reduce(
      (sum,item) =>
        sum +
        Math.max(
          0,
          Number(item.stock || 0)
        ),
      0
    );


  if(variants.length > 0){

    html += `

      <div class="stock-info">
        موجودی:
        ${formatNumber(totalStock)}
        عدد
      </div>

    `;

  }


  const needsOptions =
    colors.length > 0 ||
    sizes.length > 0;


  html += `

      <button
        class="buy-btn ${needsOptions ? 'disabled' : ''}"
        data-product-id="${escapeAttribute(id)}"
        onclick="addProduct('${escapeJs(id)}')"
      >
        ${
          needsOptions
            ? '🛒 انتخاب رنگ و سایز'
            : '🛒 افزودن به سبد خرید'
        }
      </button>

    </div>

  `;


  return html;

}


/* =========================================================
   انتخاب رنگ / سایز
========================================================= */

function selectOption(
  productId,
  type,
  value,
  button
){

  if(!selections[productId]){

    selections[productId] = {

      color:null,

      size:null

    };

  }


  const group =
    button.parentElement;


  group
    .querySelectorAll('.option-btn')
    .forEach(btn =>
      btn.classList.remove(
        'selected'
      )
    );


  button.classList.add(
    'selected'
  );


  selections[productId][type] =
    value;


  updateBuyButton(
    productId
  );

}


/* =========================================================
   فعال کردن دکمه خرید
========================================================= */

function updateBuyButton(productId){

  const product =
    productsData.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if(!product){
    return;
  }


  const variants =
    Array.isArray(product.variants)
      ? product.variants
      : [];


  const colors =
    variants.some(
      item =>
        String(item.color || '').trim()
    );


  const sizes =
    variants.some(
      item =>
        String(item.size || '').trim()
    );


  const selection =
    selections[productId];


  const button =
    document.querySelector(
      `[data-product-id="${CSS.escape(String(productId))}"]`
    );


  if(!button){
    return;
  }


  const colorOk =
    !colors ||
    Boolean(selection.color);


  const sizeOk =
    !sizes ||
    Boolean(selection.size);


  if(
    colorOk &&
    sizeOk
  ){

    button.classList.remove(
      'disabled'
    );

    button.textContent =
      '🛒 افزودن به سبد خرید';

  }else{

    button.classList.add(
      'disabled'
    );

    button.textContent =
      '🛒 انتخاب رنگ و سایز';

  }

}


/* =========================================================
   اضافه کردن محصول
========================================================= */

function addProduct(productId){

  const product =
    productsData.find(
      item =>
        String(item.id) ===
        String(productId)
    );


  if(!product){

    alert(
      'محصول پیدا نشد ❌'
    );

    return;

  }


  const variants =
    Array.isArray(product.variants)
      ? product.variants
      : [];


  const hasColor =
    variants.some(
      item =>
        String(
          item.color || ''
        ).trim()
    );


  const hasSize =
    variants.some(
      item =>
        String(
          item.size || ''
        ).trim()
    );


  const selection =
    selections[productId] || {

      color:null,

      size:null

    };


  if(
    hasColor &&
    !selection.color
  ){

    alert(
      'لطفاً رنگ محصول را انتخاب کنید 🎨'
    );

    return;

  }


  if(
    hasSize &&
    !selection.size
  ){

    alert(
      'لطفاً سایز محصول را انتخاب کنید 📏'
    );

    return;

  }


  /*
    بررسی موجودی ترکیب انتخاب‌شده
  */

  if(variants.length > 0){

    const variant =
      variants.find(item => {

        const itemColor =
          String(
            item.color || ''
          ).trim();

        const itemSize =
          String(
            item.size || ''
          ).trim();


        const colorMatch =
          !hasColor ||
          itemColor ===
          String(
            selection.color || ''
          ).trim();


        const sizeMatch =
          !hasSize ||
          itemSize ===
          String(
            selection.size || ''
          ).trim();


        return (
          colorMatch &&
          sizeMatch
        );

      });


    if(!variant){

      alert(
        'این ترکیب رنگ و سایز موجود نیست ❌'
      );

      return;

    }


    const stock =
      Number(
        variant.stock || 0
      );


    if(stock <= 0){

      alert(
        'این محصول در این رنگ و سایز موجود نیست ❌'
      );

      return;

    }

  }


  const existing =
    cartItems.find(item =>

      String(item.id) ===
      String(product.id) &&

      String(
        item.color || ''
      ) ===
      String(
        selection.color || ''
      ) &&

      String(
        item.size || ''
      ) ===
      String(
        selection.size || ''
      )

    );


  if(existing){

    existing.quantity++;

  }else{

    cartItems.push({

      id:product.id,

      name:product.name || 'محصول نوزاد',

      price:
        Number(
          product.price || 0
        ),

      image:
        product.image || '',

      color:
        selection.color || '',

      size:
        selection.size || '',

      quantity:1

    });

  }


  saveCart();


  let message =
    'محصول به سبد خرید اضافه شد 🛒';


  if(
    selection.color ||
    selection.size
  ){

    message =
      `محصول با ${
        selection.color
          ? `رنگ ${selection.color}`
          : ''
      }${
        selection.color &&
        selection.size
          ? ' و '
          : ''
      }${
        selection.size
          ? `سایز ${selection.size}`
          : ''
      } به سبد خرید اضافه شد 🛒`;

  }


  alert(message);

}


/* =========================================================
   سبد خرید
========================================================= */

function updateCartCount(){

  const count =
    cartItems.reduce(
      (total,item) =>
        total +
        Number(
          item.quantity || 0
        ),
      0
    );


  document.getElementById(
    'cart-count'
  ).textContent =
    formatNumber(count);

}


function saveCart(){

  localStorage.setItem(
    'niniCart',
    JSON.stringify(
      cartItems
    )
  );


  updateCartCount();

}


function formatPrice(value){

  return Number(
    value || 0
  ).toLocaleString(
    'fa-IR'
  );

}


function formatNumber(value){

  return Number(
    value || 0
  ).toLocaleString(
    'fa-IR'
  );

}


/* =========================================================
   باز کردن سبد
========================================================= */

function openCart(){

  const old =
    document.getElementById(
      'cart-panel'
    );


  if(old){
    old.remove();
  }


  const panel =
    document.createElement(
      'div'
    );


  panel.id =
    'cart-panel';


  panel.innerHTML = `

    <div
      class="cart-overlay"
      onclick="closeCart()"
    ></div>

    <div class="cart-box">

      <div class="cart-header">

        <h2>
          🛒 سبد خرید
        </h2>

        <button
          class="cart-close"
          onclick="closeCart()"
        >
          ×
        </button>

      </div>

      <div
        id="cart-items"
        class="cart-items"
      ></div>

      <div class="cart-footer">

        <div class="cart-total">

          <span>
            مبلغ کل:
          </span>

          <strong
            id="cart-total-price"
          >
            ۰ تومان
          </strong>

        </div>

        <button
          class="checkout-btn"
          onclick="checkoutCart()"
        >
          ادامه ثبت سفارش
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(
    panel
  );


  renderCart();

}


/* =========================================================
   بستن سبد
========================================================= */

function closeCart(){

  const panel =
    document.getElementById(
      'cart-panel'
    );


  if(panel){
    panel.remove();
  }

}


/* =========================================================
   نمایش سبد
========================================================= */

function renderCart(){

  const container =
    document.getElementById(
      'cart-items'
    );


  if(!container){
    return;
  }


  if(cartItems.length === 0){

    container.innerHTML = `

      <div class="empty-cart">

        <div style="font-size:42px">
          🛒
        </div>

        <h3>
          سبد خرید خالی است
        </h3>

        <p>
          هنوز محصولی به سبد اضافه نکرده‌اید.
        </p>

      </div>

    `;


    document.getElementById(
      'cart-total-price'
    ).textContent =
      '۰ تومان';


    return;

  }


  container.innerHTML =
    cartItems.map(
      item => `

        <div class="cart-item">

          <img
            src="${escapeAttribute(
              item.image || ''
            )}"
            alt="${escapeAttribute(
              item.name || ''
            )}"
          >

          <div class="cart-item-info">

            <h3>
              ${escapeHtml(
                item.name || ''
              )}
            </h3>

            <div class="cart-item-options">

              ${
                item.color
                  ? `🎨 رنگ: ${escapeHtml(item.color)}<br>`
                  : ''
              }

              ${
                item.size
                  ? `📏 سایز: ${escapeHtml(item.size)}`
                  : ''
              }

            </div>

            <div class="cart-item-price">

              ${formatPrice(
                item.price
              )}

              تومان

            </div>

            <div class="cart-controls">

              <button
                onclick="increaseCartItem(
                  '${escapeJs(item.id)}',
                  '${escapeJs(item.color || '')}',
                  '${escapeJs(item.size || '')}'
                )"
              >
                +
              </button>

              <span>
                ${formatNumber(
                  item.quantity
                )}
              </span>

              <button
                onclick="decreaseCartItem(
                  '${escapeJs(item.id)}',
                  '${escapeJs(item.color || '')}',
                  '${escapeJs(item.size || '')}'
                )"
              >
                −
              </button>

            </div>

          </div>

          <button
            class="cart-remove"
            onclick="removeCartItem(
              '${escapeJs(item.id)}',
              '${escapeJs(item.color || '')}',
              '${escapeJs(item.size || '')}'
            )"
          >
            🗑️
          </button>

        </div>

      `
    ).join('');


  const total =
    cartItems.reduce(
      (sum,item) =>
        sum +
        Number(
          item.price || 0
        ) *
        Number(
          item.quantity || 0
        ),
      0
    );


  document.getElementById(
    'cart-total-price'
  ).textContent =
    formatPrice(total) +
    ' تومان';

}


/* =========================================================
   افزایش
========================================================= */

function increaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(
      item =>

        String(item.id) ===
        String(id) &&

        String(item.color || '') ===
        String(color || '') &&

        String(item.size || '') ===
        String(size || '')

    );


  if(item){

    item.quantity++;

    saveCart();

    renderCart();

  }

}


/* =========================================================
   کاهش
========================================================= */

function decreaseCartItem(
  id,
  color,
  size
){

  const item =
    cartItems.find(
      item =>

        String(item.id) ===
        String(id) &&

        String(item.color || '') ===
        String(color || '') &&

        String(item.size || '') ===
        String(size || '')

    );


  if(!item){
    return;
  }


  if(
    Number(item.quantity) > 1
  ){

    item.quantity--;

  }else{

    cartItems =
      cartItems.filter(
        item => !(

          String(item.id) ===
          String(id) &&

          String(item.color || '') ===
          String(color || '') &&

          String(item.size || '') ===
          String(size || '')

        )
      );

  }


  saveCart();

  renderCart();

}


/* =========================================================
   حذف
========================================================= */

function removeCartItem(
  id,
  color,
  size
){

  cartItems =
    cartItems.filter(
      item => !(

        String(item.id) ===
        String(id) &&

        String(item.color || '') ===
        String(color || '') &&

        String(item.size || '') ===
        String(size || '')

      )
    );


  saveCart();

  renderCart();

}


/* =========================================================
   ثبت سفارش
========================================================= */

function checkoutCart(){

  if(
    cartItems.length === 0
  ){

    alert(
      'سبد خرید شما خالی است.'
    );

    return;

  }


  window.location.href =
    'checkout.html';

}


/* =========================================================
   جلوگیری از خراب شدن HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeAttribute(value){

  return escapeHtml(
    value
  );

}


function escapeJs(value){

  return String(
    value ?? ''
  )
  .replace(
    /\\/g,
    '\\\\'
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    '\\n'
  )
  .replace(
    /\r/g,
    '\\r'
  );

}


/* =========================================================
   شروع
========================================================= */

updateCartCount();

loadProducts();

</script>

</html>
