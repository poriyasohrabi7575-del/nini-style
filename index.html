<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نی نی استایل | فروشگاه لباس کودک</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{
background:#ffffff;
color:#333;
}

.topbar{

background:#ffd5e7;
padding:12px;
text-align:center;
font-weight:bold;

}

header{

display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:white;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.logo{

font-size:34px;
font-weight:800;
color:#ff6ca8;

}

nav a{

text-decoration:none;
margin:0 10px;
color:#444;
font-weight:600;

}

.hero{

height:650px;
background:linear-gradient(135deg,#ffffff,#fff8f0,#dff6ff,#ffeaf4);

display:flex;

justify-content:center;

align-items:center;

text-align:center;

padding:40px;

}

.hero h1{

font-size:60px;
margin-bottom:20px;

}

.hero p{

font-size:22px;
margin-bottom:35px;

}

button{

background:#ff6ca8;

color:white;

padding:18px 40px;

border:none;

border-radius:50px;

font-size:20px;

cursor:pointer;

}
.categories{

padding:80px 8%;

background:#fff;

}

.categories h2{

text-align:center;

font-size:40px;

margin-bottom:50px;

color:#444;

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:30px;

}

.card{

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.08);

transition:.3s;

cursor:pointer;

}

.card:hover{

transform:translateY(-8px);

}

.card img{

width:100%;

display:block;

}

.card h3{

padding:20px;

text-align:center;

font-size:24px;

color:#444;

}
</style>

</head>

<body>

<div class="topbar">

🚚 ارسال رایگان برای خریدهای بالای ۲ میلیون تومان

</div>

<header>

<div class="logo">

نی نی استایل

</div>

<nav>

<a href="#">خانه</a>

<a href="#">لباس دخترانه</a>

<a href="#">لباس پسرانه</a>

<a href="#">لباس نوزاد</a>

<a href="#">اکسسوری</a>

<a href="#">تخفیف‌ها</a>

<a href="#">تماس با ما</a>

</nav>

</header>

<section class="hero">

<div>

<h1>

لباس‌های خاص برای کوچولوهای خاص

</h1>

<p>

جدیدترین لباس‌های کودک با کیفیت عالی و طراحی مدرن

</p>

<button>

مشاهده محصولات

</button>

</div>

</section>
<section class="categories">

<h2>دسته‌بندی محصولات</h2>

<div class="cards">

<div class="card">
<img src="https://placehold.co/300x300/f8bbd9/ffffff?text=دخترانه">
<h3>لباس دخترانه</h3>
</div>

<div class="card">
<img src="https://placehold.co/300x300/b3e5fc/ffffff?text=پسرانه">
<h3>لباس پسرانه</h3>
</div>

<div class="card">
<img src="https://placehold.co/300x300/fff3cd/333333?text=نوزاد">
<h3>لباس نوزاد</h3>
</div>

<div class="card">
<img src="https://placehold.co/300x300/f5f5f5/333333?text=اکسسوری">
<h3>اکسسوری</h3>
</div>

</div>

</section>
</body>

</html>
