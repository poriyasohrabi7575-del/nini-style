<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت نی نی استایل</title>

<style>

body{
font-family:Tahoma,Arial;
background:#fff7fb;
padding:40px;
}

h1{
text-align:center;
color:#ff6fa8;
}

.box{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:15px;
margin:10px 0;
border-radius:15px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#ff6fa8;
color:white;
border:0;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff4d94;
}

</style>

</head>

<body>

<h1>
🧸 پنل مدیریت نی نی استایل
</h1>

<div class="box">

<input type="text" placeholder="نام محصول">

<input type="number" placeholder="قیمت محصول">
<input type="number" placeholder="قیمت قبل از تخفیف">
<label>
عکس محصول
</label>

<input type="file" accept="image/*">
<input type="number" placeholder="درصد تخفیف مثلا ۳۰">
<select>
<option>لباس دخترانه</option>
<option>لباس پسرانه</option>
<option>لباس نوزاد</option>
<option>اکسسوری</option>
</select>

<button onclick="addProduct()">
➕ افزودن محصول
</button>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClty2axVVJuvvmc27VLivTzp3cijZ-8oo",
    authDomain: "nini-style.firebaseapp.com",
    projectId: "nini-style",
    storageBucket: "nini-style.firebasestorage.app",
    messagingSenderId: "935164642738",
    appId: "1:935164642738:web:33ecf6b01c00f9f08b10ab"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function addProduct() {
    let name = document.querySelector('input[placeholder="نام محصول"]').value;
    let price = document.querySelector('input[placeholder="قیمت محصول"]').value;
    let oldPrice = document.querySelector('input[placeholder="قیمت قبل از تخفیف"]').value;
    let discount = document.querySelector('input[placeholder^="درصد تخفیف"]').value;
    let category = document.querySelector('select').value;

    try {
      await addDoc(collection(db, "products"), {
        name: name,
        price: price,
        oldPrice: oldPrice,
        discount: discount,
        category: category,
        createdAt: new Date()
      });

      alert("محصول داخل Firebase ذخیره شد ✅");
    } catch (error) {
      alert("خطا در ذخیره محصول ❌");
      console.log(error);
    }
  }

  window.addProduct = addProduct;
document.querySelector('button').addEventListener('click', () => {
    window.addProduct();
});

</script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyClty2axVVJuvvmc27VLivTzp3cijZ-8oo",
  authDomain: "nini-style.firebaseapp.com",
  projectId: "nini-style",
  storageBucket: "nini-style.firebasestorage.app",
  messagingSenderId: "935164642738",
  appId: "1:935164642738:web:33ecf6b01c00f9f08b10ab"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

console.log("Firebase وصل شد");

</script>
</body>
</html>
