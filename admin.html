<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت نی نی استایل</title>

<style>

body{
font-family:Tahoma,Arial;
background:#fff7fb;
padding:40px;
}

h1{
text-align:center;
color:#ff6fa8;
}

.box{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

input,select{
width:100%;
padding:15px;
margin:10px 0;
border-radius:15px;
border:1px solid #ddd;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#ff6fa8;
color:white;
border:0;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff4d94;
}

</style>

</head>

<body>

<h1>
🧸 پنل مدیریت نی نی استایل
</h1>

<div class="box">

<input type="text" placeholder="نام محصول">

<input type="number" placeholder="قیمت محصول">
<input type="number" placeholder="قیمت قبل از تخفیف">

<input type="number" placeholder="درصد تخفیف مثلا ۳۰">
<select>
<option>لباس دخترانه</option>
<option>لباس پسرانه</option>
<option>لباس نوزاد</option>
<option>اکسسوری</option>
</select>

<input type="file">

<button>
➕ افزودن محصول
</button>

</div>

</body>

</html>
