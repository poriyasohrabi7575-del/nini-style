<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت نی نی استایل</title>

<style>

body{
    font-family:tahoma;
    background:#f8f8f8;
    padding:30px;
    margin:0;
    color:#444;
}

.box{
    max-width:900px;
    margin:0 auto 25px;
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 10px rgba(0,0,0,.08);
}

h2{
    color:#e88aaa;
    margin-top:0;
}

input,
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
    border-radius:8px;
    font-family:tahoma;
}

input{
    border:1px solid #ddd;
}

button{
    background:#ff5ca8;
    color:#fff;
    border:none;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

#result{
    margin-top:15px;
    font-weight:bold;
}

.order{
    border:1px solid #f0dce5;
    border-radius:12px;
    padding:18px;
    margin-top:15px;
    background:#fffafb;
}

.order-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    padding-bottom:12px;
    border-bottom:1px solid #f0dce5;
}

.order-title{
    font-weight:bold;
    color:#e88aaa;
}

.order-date{
    color:#777;
    font-size:13px;
}

.order-info{
    line-height:2;
    margin-top:12px;
}

.order-products{
    margin-top:12px;
    padding:12px;
    background:#fff;
    border-radius:8px;
}

.product-row{
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.product-row:last-child{
    border-bottom:none;
}

.order-total{
    margin-top:12px;
    font-size:18px;
    font-weight:bold;
    color:#e88aaa;
}

.empty-orders{
    text-align:center;
    padding:30px;
    color:#888;
}

.loading{
    text-align:center;
    padding:25px;
    color:#888;
}

.refresh-btn{
    background:#777;
    margin-bottom:10px;
}

@media(max-width:600px){

    body{
        padding:12px;
    }

    .box{
        padding:15px;
    }

}

</style>

</head>


<body>


<!-- ========================= -->
<!-- مدیریت محصولات -->
<!-- ========================= -->

<div class="box">

<h2>🎀 پنل مدیریت نی نی استایل</h2>

<input
    id="name"
    placeholder="نام محصول"
>

<input
    id="price"
    placeholder="قیمت"
>

<input
    id="oldPrice"
    placeholder="قیمت قبلی"
>

<input
    id="image"
    placeholder="/images/dokhtarane.png"
>

<input
    id="category"
    placeholder="دسته بندی"
>

<button onclick="saveProduct()">
    ذخیره محصول
</button>

<div id="result"></div>

</div>


<!-- ========================= -->
<!-- مدیریت سفارش‌ها -->
<!-- ========================= -->

<div class="box">

<h2>📦 مدیریت سفارش‌ها</h2>

<button
    class="refresh-btn"
    onclick="loadOrders()"
>
    🔄 بروزرسانی سفارش‌ها
</button>

<div id="orders">

    <div class="loading">
        در حال دریافت سفارش‌ها...
    </div>

</div>

</div>


<script>


// ==========================================
// ذخیره محصول
// ==========================================

async function saveProduct(){

    const product = {

        name:
            document.getElementById("name").value,

        price:
            document.getElementById("price").value,

        oldPrice:
            document.getElementById("oldPrice").value,

        image:
            document.getElementById("image").value,

        category:
            document.getElementById("category").value

    };


    try{

        const res = await fetch(
            "/api/products",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(product)
            }
        );


        const data = await res.json();


        document.getElementById("result").innerHTML =
            data.success
            ? "✅ محصول ذخیره شد"
            : "❌ " + (data.error || "خطا");


    }catch(err){

        document.getElementById("result").innerHTML =
            "❌ " + err.message;

    }

}



// ==========================================
// فرمت مبلغ
// ==========================================

function formatPrice(price){

    return Number(price || 0)
        .toLocaleString("fa-IR")
        + " تومان";

}



// ==========================================
// فرمت تاریخ و ساعت
// ==========================================

function formatDate(dateString){

    if(!dateString){
        return "نامشخص";
    }


    const date = new Date(dateString);


    if(isNaN(date.getTime())){
        return "نامشخص";
    }


    return date.toLocaleString(
        "fa-IR",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );

}



// ==========================================
// نمایش محصولات سفارش
// ==========================================

function renderProducts(products){

    if(!Array.isArray(products)){
        return "محصولی ثبت نشده";
    }


    if(!products.length){
        return "محصولی ثبت نشده";
    }


    return products.map(function(product){

        const name =
            product.name ||
            product.title ||
            product.productName ||
            "محصول";


        const quantity =
            product.quantity ??
            product.qty ??
            product.count ??
            1;


        const price =
            Number(
                product.price ||
                product.salePrice ||
                product.discountPrice ||
                product.finalPrice ||
                0
            );


        return `
            <div class="product-row">

                🛍️ ${name}

                <br>

                🔢 تعداد:
                ${Number(quantity).toLocaleString("fa-IR")}

                <br>

                💰 قیمت:
                ${formatPrice(price)}

            </div>
        `;

    }).join("");

}



// ==========================================
// دریافت سفارش‌ها
// ==========================================

async function loadOrders(){

    const container =
        document.getElementById("orders");


    container.innerHTML = `
        <div class="loading">
            در حال دریافت سفارش‌ها...
        </div>
    `;


    try{

        const res =
            await fetch("/api/orders");


        const data =
            await res.json();


        if(
            !res.ok ||
            !data.success
        ){

            throw new Error(
                data.error ||
                "خطا در دریافت سفارش‌ها"
            );

        }


        const orders =
            Array.isArray(data.orders)
            ? data.orders
            : [];


        if(!orders.length){

            container.innerHTML = `
                <div class="empty-orders">
                    هنوز سفارشی ثبت نشده است.
                </div>
            `;

            return;
        }


        container.innerHTML =
            orders.map(function(order,index){

                return `

                    <div class="order">

                        <div class="order-header">

                            <div class="order-title">
                                📦 سفارش شماره
                                ${(
                                    index + 1
                                ).toLocaleString("fa-IR")}
                            </div>

                            <div class="order-date">
                                🕐
                                ${formatDate(
                                    order.createdAt
                                )}
                            </div>

                        </div>


                        <div class="order-info">

                            👤
                            <strong>نام:</strong>
                            ${order.name || "-"}

                            <br>

                            📱
                            <strong>موبایل:</strong>
                            ${order.mobile || "-"}

                            <br>

                            📮
                            <strong>کد پستی:</strong>
                            ${order.postalCode || "-"}

                            <br>

                            🏠
                            <strong>آدرس:</strong>
                            ${order.address || "-"}

                        </div>


                        <div class="order-products">

                            <strong>
                                🛍️ محصولات
                            </strong>

                            <br><br>

                            ${renderProducts(
                                order.products
                            )}

                        </div>


                        <div class="order-total">

                            💰 مبلغ کل:
                            ${formatPrice(
                                order.totalAmount
                            )}

                            <br>

                            🔢 تعداد کل:
                            ${Number(
                                order.quantity || 0
                            ).toLocaleString("fa-IR")}

                        </div>

                    </div>

                `;

            }).join("");


    }catch(error){

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        container.innerHTML = `

            <div class="empty-orders">

                ❌ دریافت سفارش‌ها انجام نشد.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}



// ==========================================
// اجرای اولیه
// ==========================================

loadOrders();


</script>


</body>

</html>
