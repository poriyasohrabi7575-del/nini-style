<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت نی نی استایل</title>

<style>
body{
    font-family:tahoma;
    background:#f8f8f8;
    padding:30px;
}
.box{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}
button{
    background:#ff5ca8;
    color:#fff;
    border:none;
    cursor:pointer;
}
#result{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h2>پنل مدیریت نی نی استایل</h2>

<input id="name" placeholder="نام محصول">
<input id="price" placeholder="قیمت">
<input id="oldPrice" placeholder="قیمت قبلی">
<input id="image" placeholder="/images/dokhtarane.png">
<input id="category" placeholder="دسته بندی">

<button onclick="saveProduct()">ذخیره محصول</button>

<div id="result"></div>

</div>

<script>
async function saveProduct(){

const product={
name:document.getElementById("name").value,
price:document.getElementById("price").value,
oldPrice:document.getElementById("oldPrice").value,
image:document.getElementById("image").value,
category:document.getElementById("category").value
};

try{

const res=await fetch("/api/products",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(product)
});

const data=await res.json();

document.getElementById("result").innerHTML=data.success
?"✅ محصول ذخیره شد"
:"❌ "+(data.error||"خطا");

}catch(err){

document.getElementById("result").innerHTML="❌ "+err.message;

}

}
</script>

</body>
</html>
