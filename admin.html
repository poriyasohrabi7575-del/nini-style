<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>پنل مدیریت نی نی استایل</title>

<style>
body{
    font-family:tahoma;
    background:#fff5fa;
    padding:30px;
}

.box{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px #ddd;
}

input,button{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    background:#ff8fc7;
    color:white;
    border:none;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>پنل مدیریت نی نی استایل</h2>

<input id="name" placeholder="نام محصول">

<input id="price" placeholder="قیمت">

<input id="oldPrice" placeholder="قیمت قبلی">

<input id="image" placeholder="مسیر عکس مثال: /images/dokhtarane.png">

<input id="category" placeholder="دسته بندی">

<button onclick="saveProduct()">ذخیره محصول</button>

<p id="result"></p>

</div>


<script>

async function saveProduct(){

const product={
name:document.getElementById("name").value,
price:document.getElementById("price").value,
oldPrice:document.getElementById("oldPrice").value,
image:document.getElementById("image").value,
category:document.getElementById("category").value
};


const res = await fetch("/api/products",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(product)
});


const data=await res.json();


if(data.success){
document.getElementById("result").innerHTML="✅ محصول ذخیره شد";
}else{
document.getElementById("result").innerHTML="❌ خطا در ذخیره";
}

}

</script>


</body>
</html>
