oninput="filterOrders()"
>

<strong id="preparingOrdersCount">۰</strong>
</div>

</div>

</div>

<script>


// ==========================================
// متغیرهای سفارش
// ==========================================

let allOrders = [];

let filteredOrders = [];

let currentOrderPage = 1;

const ordersPerPage = 10;

let currentOrderFilter = "all";


// ==========================================
// محصولات
// ==========================================

async function loadProducts(){

const box =
document.getElementById("products");

box.innerHTML =
`<div class="loading">
در حال دریافت محصولات...
</div>`;

try{

const res =
await fetch("/api/products");

const data =
await res.json();

const products =
Array.isArray(data)
? data
: data.products || [];

document.getElementById(
"productsCount"
).textContent =
products.length.toLocaleString("fa-IR");


if(!products.length){

box.innerHTML =
`<div class="empty">
محصولی وجود ندارد.
</div>`;

return;

}


box.innerHTML =
products.map(product => `

<div class="product-card">

<img
src="${product.image || ""}"
onerror="this.style.display='none'"
>

<strong>
${escapeHtml(
product.name || "-"
)}
</strong>

<p>
💰
${Number(
product.price || 0
).toLocaleString("fa-IR")}
تومان
</p>

<small>
📂
${escapeHtml(
product.category || "-"
)}
</small>

<div class="product-actions">

<button
class="edit"
onclick='editProduct(${JSON.stringify(product)})'
>
✏️ ویرایش
</button>

<button
class="danger"
onclick="deleteProduct('${product.id}')"
>
🗑️ حذف
</button>

</div>

</div>

`).join("");


}catch(error){

box.innerHTML =
`<div class="empty">
❌
${escapeHtml(error.message)}
</div>`;

}

}


// ==========================================
// ذخیره محصول
// ==========================================

async function saveProduct(){

const file =
document.getElementById(
"imageFile"
).files[0];

let image =
document.getElementById(
"image"
).value.trim();


if(file){

const reader =
new FileReader();

image =
await new Promise(resolve => {

reader.onload =
() => resolve(reader.result);

reader.readAsDataURL(file);

});

}


const product = {

name:
document.getElementById(
"name"
).value,

price:
Number(
document.getElementById(
"price"
).value || 0
),

oldPrice:
Number(
document.getElementById(
"oldPrice"
).value || 0
),

image:image,

category:
document.getElementById(
"category"
).value

};


const id =
document.getElementById(
"productId"
).value;


if(id){

product.id = id;

}


try{

const res =
await fetch(
"/api/products",
{
method:
id ? "PUT" : "POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(product)

}
);


const data =
await res.json();


if(!res.ok){

throw new Error(
data.error || "خطا"
);

}


document.getElementById(
"result"
).textContent =
id
? "✅ محصول ویرایش شد"
: "✅ محصول ذخیره شد";


clearForm();

loadProducts();


}catch(error){

document.getElementById(
"result"
).textContent =
"❌ " +
error.message;

}

}


// ==========================================
// ویرایش محصول
// ==========================================

function editProduct(product){

document.getElementById(
"productId"
).value =
product.id;

document.getElementById(
"name"
).value =
product.name || "";

document.getElementById(
"price"
).value =
product.price || "";

document.getElementById(
"oldPrice"
).value =
product.oldPrice || "";

document.getElementById(
"category"
).value =
product.category || "";

document.getElementById(
"image"
).value =
product.image || "";

window.scrollTo({
top:0,
behavior:"smooth"
});

}


// ==========================================
// حذف محصول
// ==========================================

async function deleteProduct(id){

if(!confirm(
"مطمئنی می‌خواهی این محصول حذف شود؟"
)){

return;

}


try{

const res =
await fetch(
"/api/products",
{
method:"DELETE",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({id})

}
);


const data =
await res.json();


if(!res.ok){

throw new Error(
data.error || "خطا"
);

}


loadProducts();


}catch(error){

alert(
"❌ " +
error.message
);

}

}


// ==========================================
// دریافت سفارش‌ها
// ==========================================

async function loadOrders(){

const box =
document.getElementById(
"orders"
);

box.innerHTML =
`<div class="loading">
در حال دریافت سفارش‌ها...
</div>`;

document.getElementById(
"pagination"
).innerHTML = "";


try{

const res =
await fetch(
"/api/orders"
);


const data =
await res.json();


if(!res.ok){

throw new Error(
data.error || "خطا"
);

}


allOrders =
Array.isArray(data.orders)
? data.orders
: [];


document.getElementById(
"ordersCount"
).textContent =
allOrders.length.toLocaleString(
"fa-IR"
);


const totalSales =
allOrders.reduce(
(sum,order) =>
sum +
Number(
order.totalAmount || 0
),
0
);


document.getElementById(
"salesTotal"
).textContent =
totalSales.toLocaleString(
"fa-IR"
)
+
" تومان";


updateOrderStats();

currentOrderPage = 1;

filterOrders();


}catch(error){

box.innerHTML =
`<div class="empty">
❌
${escapeHtml(
error.message
)}
</div>`;

}

}


// ==========================================
// آمار وضعیت
// ==========================================

function updateOrderStats(){

const countStatus =
status => {

return allOrders.filter(
order =>
(order.status || "new")
===
status
).length;

};


document.getElementById(
"allOrdersCount"
).textContent =
allOrders.length.toLocaleString(
"fa-IR"
);


document.getElementById(
"newOrdersCount"
).textContent =
countStatus("new")
.toLocaleString("fa-IR");


document.getElementById(
"preparingOrdersCount"
).textContent =
countStatus("preparing")
.toLocaleString("fa-IR");


document.getElementById(
"shippedOrdersCount"
).textContent =
countStatus("shipped")
.toLocaleString("fa-IR");


document.getElementById(
"deliveredOrdersCount"
).textContent =
countStatus("delivered")
.toLocaleString("fa-IR");

}


// ==========================================
// فیلتر وضعیت
// ==========================================

function setOrderFilter(status){

currentOrderFilter =
status;

currentOrderPage = 1;


document
.querySelectorAll(
".order-filter"
)
.forEach(
button =>
button.classList.remove(
"active"
)
);


const activeButton =
document.getElementById(
"filter-" + status
);


if(activeButton){

activeButton.classList.add(
"active"
);

}


filterOrders();

}


// ==========================================
// جستجو
// ==========================================

function filterOrders(){

const searchInput =
document.getElementById(
"orderSearch"
);


const search =
(
searchInput
? searchInput.value
: ""
)
.trim()
.toLowerCase();


filteredOrders =
allOrders.filter(
order => {

const status =
order.status || "new";


if(
currentOrderFilter !==
"all"
&&
status !==
currentOrderFilter
){

return false;

}


if(!search){

return true;

}


const name =
String(
order.name || ""
).toLowerCase();


const mobile =
String(
order.mobile || ""
).toLowerCase();


const trackingCode =
String(
order.trackingCode || ""
).toLowerCase();


const orderId =
String(
order.id || ""
).toLowerCase();


return (

name.includes(search)
||
mobile.includes(search)
||
trackingCode.includes(search)
||
orderId.includes(search)

);

}
);


renderOrders();

}


// ==========================================
// نمایش سفارش‌ها
// ==========================================

function renderOrders(){

const box =
document.getElementById(
"orders"
);

const pagination =
document.getElementById(
"pagination"
);

const info =
document.getElementById(
"searchResultInfo"
);


if(!filteredOrders.length){

box.innerHTML =
`<div class="empty">
🔍
سفارشی با این مشخصات پیدا نشد.
</div>`;

pagination.innerHTML = "";

info.textContent = "";

return;

}


const totalPages =
Math.ceil(
filteredOrders.length /
ordersPerPage
);


if(
currentOrderPage >
totalPages
){

currentOrderPage =
totalPages;

}


const start =
(
currentOrderPage - 1
)
*
ordersPerPage;


const end =
start +
ordersPerPage;


const pageOrders =
filteredOrders.slice(
start,
end
);


info.textContent =
`نمایش ${
(start + 1).toLocaleString("fa-IR")
} تا ${
Math.min(
end,
filteredOrders.length
).toLocaleString("fa-IR")
} از ${
filteredOrders.length.toLocaleString("fa-IR")
} سفارش`;


box.innerHTML =
pageOrders.map(
(order,index) => {

const realIndex =
start + index;


return `

<div class="order">

<div class="order-header">

<div class="order-title">

📦 سفارش شماره
${(
realIndex + 1
).toLocaleString("fa-IR")}

<br>

<small
style="
color:#888;
font-weight:normal;
"
>
کد سفارش:
${escapeHtml(
order.id || "-"
)}
</small>

</div>


<div class="order-date">

🕐
${formatDate(
order.createdAt
)}

</div>

</div>


<div class="order-info">

👤
<strong>نام:</strong>
${escapeHtml(
order.name || "-"
)}

<br>

📱
<strong>موبایل:</strong>
${escapeHtml(
order.mobile || "-"
)}

<br>

📮
<strong>کد پستی:</strong>
${escapeHtml(
order.postalCode || "-"
)}

<br>

🏠
<strong>آدرس:</strong>
${escapeHtml(
order.address || "-"
)}

</div>


<div class="order-products">

🛍️
<strong>
محصولات
</strong>

<br><br>

${renderProducts(
order.products
)}

</div>


<div class="order-total">

💰
مبلغ کل:

${Number(
order.totalAmount || 0
).toLocaleString(
"fa-IR"
)}

تومان

<br>

🔢
تعداد:

${Number(
order.quantity || 0
).toLocaleString(
"fa-IR"
)}

</div>


<!-- کد رهگیری -->

<div class="tracking-box">

<div class="tracking-title">

📮
کد رهگیری مرسوله

</div>


<input
id="tracking-${escapeHtml(order.id)}"
type="text"
value="${escapeHtml(
order.trackingCode || ""
)}"
placeholder="کد رهگیری مرسوله را وارد کنید"
>


<button
class="tracking-button"
onclick="saveTrackingCode('${escapeHtml(order.id)}')"
>
💾 ثبت کد رهگیری
</button>


<div
id="tracking-result-${escapeHtml(order.id)}"
class="tracking-result"
></div>

</div>


<!-- دریافت مشتری -->

${renderCustomerReceived(
order
)}


<!-- وضعیت -->

<div class="status">

<strong>
وضعیت سفارش:
</strong>


<select
onchange="changeStatus(
'${escapeHtml(order.id)}',
this.value
)"
>

<option
value="new"
${
(order.status || "new")
===
"new"
? "selected"
: ""
}
>
🟡 جدید
</option>


<option
value="preparing"
${
order.status ===
"preparing"
? "selected"
: ""
}
>
🔵 آماده‌سازی
</option>


<option
value="shipped"
${
order.status ===
"shipped"
? "selected"
: ""
}
>
🚚 ارسال شد
</option>


<option
value="delivered"
${
order.status ===
"delivered"
? "selected"
: ""
}
>
🟢 تحویل شد
</option>

</select>

</div>


<!-- حذف سفارش -->

<button
class="delete-order-button"
onclick="deleteOrder('${escapeHtml(order.id)}')"
>
❌ حذف این سفارش
</button>


</div>

`;

}
).join("");


renderPagination(
totalPages
);

}


// ==========================================
// حذف سفارش
// ==========================================

async function deleteOrder(id){

const order =
allOrders.find(
item =>
item.id === id
);


const customerName =
order &&
order.name
? order.name
: "این سفارش";


const confirmed =
confirm(
`⚠️ مطمئنی می‌خواهی سفارش «${customerName}» را حذف کنی؟

این کار سفارش را برای همیشه از دیتابیس حذف می‌کند و قابل برگشت نیست.`
);


if(!confirmed){

return;

}


try{

const res =
await fetch(
"/api/orders",
{
method:"DELETE",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
id
})
}
);


const data =
await res.json();


if(!res.ok){

throw new Error(
data.error ||
"خطا در حذف سفارش"
);

}


allOrders =
allOrders.filter(
order =>
order.id !== id
);


updateOrderStats();

filterOrders();


alert(
"✅ سفارش با موفقیت حذف شد."
);


}catch(error){

alert(
"❌ خطا در حذف سفارش:\n" +
error.message
);

}

}


// ==========================================
// صفحه‌بندی
// ==========================================

function renderPagination(
totalPages
){

const box =
document.getElementById(
"pagination"
);


if(totalPages <= 1){

box.innerHTML = "";

return;

}


let html = `

<div class="pagination">

<button
onclick="changeOrderPage(
${currentOrderPage - 1}
)"
${currentOrderPage === 1
? "disabled"
: ""}
>
◀️ قبلی
</button>

`;


const maxButtons = 7;


let startPage =
Math.max(
1,
currentOrderPage - 3
);


let endPage =
Math.min(
totalPages,
startPage + maxButtons - 1
);


if(
endPage -
startPage +
1
<
maxButtons
){

startPage =
Math.max(
1,
endPage -
maxButtons +
1
);

}


for(
let page =
startPage;
page <=
endPage;
page++
){

html += `

<button
class="${
page ===
currentOrderPage
? "active"
: ""
}"
onclick="changeOrderPage(
${page}
)"
>
${page.toLocaleString("fa-IR")}
</button>

`;

}


html += `

<button
onclick="changeOrderPage(
${currentOrderPage + 1}
)"
${
currentOrderPage ===
totalPages
? "disabled"
: ""
}
>
بعدی ▶️
</button>


<div class="page-info">

صفحه
${currentOrderPage.toLocaleString("fa-IR")}
از
${totalPages.toLocaleString("fa-IR")}

</div>

</div>

`;


box.innerHTML =
html;

}


// ==========================================
// تغییر صفحه
// ==========================================

function changeOrderPage(
page
){

const totalPages =
Math.ceil(
filteredOrders.length /
ordersPerPage
);


if(
page < 1 ||
page > totalPages
){

return;

}


currentOrderPage =
page;


renderOrders();


document.getElementById(
"orders"
).scrollIntoView({
behavior:"smooth",
block:"start"
});

}

async function saveTrackingCode(
id
){

const input =
document.getElementById(
"tracking-" + id
);


const result =
document.getElementById(
"tracking-result-" + id
);


if(!input){

return;

}


const trackingCode =
input.value.trim();


if(!trackingCode){

result.textContent =
"⚠️ لطفاً کد رهگیری را وارد کنید.";

return;

}


result.textContent =
"⏳ در حال ثبت کد رهگیری...";

const res =
await fetch(
"/api/orders",
{
method:"PATCH",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({
id,
trackingCode
})
}
);


const data =
await res.json();


if(!res.ok){

throw new Error(
data.error ||
"خطا در ثبت کد رهگیری"
);

}


const order =
allOrders.find(
item =>
item.id === id
);


if(order){

order.trackingCode =
trackingCode;

}


result.textContent =
"✅ کد رهگیری با موفقیت ثبت شد";


}catch(error){

result.textContent =
"❌ " +
error.message;

}

}

// ==========================================
// تاریخ
// ==========================================

function formatDate(
value
){

if(!value){

return "-";

}


const date =
new Date(value);


if(
isNaN(
date.getTime()
)
){

return "-";

}


return date.toLocaleString(
"fa-IR",
{
year:"numeric",
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);

}

// ==========================================
// امنیت نمایش متن
// ==========================================

function escapeHtml(
value
){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
