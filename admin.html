<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت نی نی استایل</title>

<style>

body{
    font-family:tahoma;
    background:#f8f8f8;
    padding:20px;
    margin:0;
    color:#444;
}

.box{
    max-width:950px;
    margin:0 auto 25px;
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 10px rgba(0,0,0,.08);
}

h2{
    color:#e88aaa;
    margin-top:0;
}

input,
select,
button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
    border-radius:8px;
    font-family:tahoma;
}

input,
select{
    border:1px solid #ddd;
}

button{
    border:none;
    cursor:pointer;
    color:#fff;
    background:#ff5ca8;
}

.secondary{
    background:#777;
}

.danger{
    background:#e74c3c;
}

.edit{
    background:#6c8cff;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    padding:18px 10px;
    border-radius:12px;
    background:#fff5fa;
    text-align:center;
    border:1px solid #f3dce7;
}

.stat-number{
    font-size:22px;
    font-weight:bold;
    color:#e88aaa;
    margin-top:7px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:15px;
    margin-top:20px;
}

.product-card{
    border:1px solid #f0dce5;
    border-radius:12px;
    padding:12px;
    background:#fffafb;
}

.product-card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:9px;
}

.product-actions{
    display:flex;
    gap:8px;
}

.product-actions button{
    flex:1;
}

.order{
    border:1px solid #f0dce5;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
    background:#fffafb;
}

.order-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    border-bottom:1px solid #f0dce5;
    padding-bottom:10px;
}

.order-title{
    font-weight:bold;
    color:#e88aaa;
}

.order-date{
    font-size:12px;
    color:#777;
}

.order-info{
    line-height:2;
    margin-top:10px;
}

.order-products{
    background:#fff;
    border-radius:8px;
    padding:10px;
    margin-top:10px;
}

.order-total{
    color:#e88aaa;
    font-weight:bold;
    margin-top:10px;
}

.status{
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    background:#fff;
}

.status select{
    margin-top:6px;
}

.loading,
.empty{
    text-align:center;
    padding:25px;
    color:#888;
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<!-- ========================= -->
<!-- آمار -->
<!-- ========================= -->

<div class="box">

<h2>📊 آمار فروشگاه</h2>

<div class="stats">

    <div class="stat">
        📦 سفارش‌ها
        <div
            class="stat-number"
            id="ordersCount"
        >
            ۰
        </div>
    </div>

    <div class="stat">
        🛍️ محصولات
        <div
            class="stat-number"
            id="productsCount"
        >
            ۰
        </div>
    </div>

    <div class="stat">
        💰 فروش
        <div
            class="stat-number"
            id="salesTotal"
        >
            ۰ تومان
        </div>
    </div>

</div>

</div>


<!-- ========================= -->
<!-- مدیریت محصولات -->
<!-- ========================= -->

<div class="box">

<h2>🎀 مدیریت محصولات</h2>

<input type="hidden" id="productId">

<input id="name" placeholder="نام محصول">

<input
    id="price"
    type="number"
    placeholder="قیمت"
/>

<input
    id="oldPrice"
    type="number"
    placeholder="قیمت قبلی"
/>

<select id="category">

    <option value="">انتخاب دسته‌بندی</option>

    <option value="لباس دخترانه">
        لباس دخترانه
    </option>

    <option value="لباس پسرانه">
        لباس پسرانه
    </option>

    <option value="لباس نوزاد">
        لباس نوزاد
    </option>

    <option value="اکسسوری">
        اکسسوری
    </option>

    <option value="تخفیف خورده">
        تخفیف خورده
    </option>

</select>

<input
    id="imageFile"
    type="file"
    accept="image/*"
/>

<input
    id="image"
    placeholder="یا آدرس عکس"
/>

<button onclick="saveProduct()">
    💾 ذخیره محصول
</button>

<div id="result"></div>

</div>


<!-- ========================= -->
<!-- محصولات -->
<!-- ========================= -->

<div class="box">

<h2>🛍️ محصولات فروشگاه</h2>

<button
    class="secondary"
    onclick="loadProducts()"
>
    🔄 بروزرسانی محصولات
</button>

<div
    id="products"
    class="products-grid"
></div>

</div>


<!-- ========================= -->
<!-- سفارش‌ها -->
<!-- ========================= -->

<div class="box">

<h2>📦 مدیریت سفارش‌ها</h2>

<button
    class="secondary"
    onclick="loadOrders()"
>
    🔄 بروزرسانی سفارش‌ها
</button>

<div id="orders"></div>

</div>


<script>


// ==========================================
// محصولات
// ==========================================

async function loadProducts(){

    const box =
        document.getElementById("products");

    box.innerHTML =
        `<div class="loading">
            در حال دریافت محصولات...
        </div>`;

    try{

        const res =
            await fetch("/api/products");

        const data =
            await res.json();

        const products =
            Array.isArray(data)
            ? data
            : data.products || [];

        document.getElementById(
            "productsCount"
        ).textContent =
            products.length.toLocaleString("fa-IR");

        if(!products.length){

            box.innerHTML =
                `<div class="empty">
                    محصولی وجود ندارد.
                </div>`;

            return;
        }

        box.innerHTML =
            products.map(product => `

                <div class="product-card">

                    <img
                        src="${product.image || ""}"
                        onerror="this.style.display='none'"
                    >

                    <strong>
                        ${escapeHtml(product.name || "-")}
                    </strong>

                    <p>
                        💰
                        ${Number(
                            product.price || 0
                        ).toLocaleString("fa-IR")}
                        تومان
                    </p>

                    <small>
                        📂 ${escapeHtml(
                            product.category || "-"
                        )}
                    </small>

                    <div class="product-actions">

                        <button
                            class="edit"
                            onclick='editProduct(${JSON.stringify(product)})'
                        >
                            ✏️ ویرایش
                        </button>

                        <button
                            class="danger"
                            onclick="deleteProduct('${product.id}')"
                        >
                            🗑️ حذف
                        </button>

                    </div>

                </div>

            `).join("");

    }catch(error){

        box.innerHTML =
            `<div class="empty">
                ❌ ${escapeHtml(error.message)}
            </div>`;
    }
}



// ==========================================
// ذخیره محصول
// ==========================================

async function saveProduct(){

    const file =
        document.getElementById("imageFile").files[0];

    let image =
        document.getElementById("image").value.trim();

    if(file){

        const reader =
            new FileReader();

        image =
            await new Promise(resolve => {

                reader.onload =
                    () => resolve(reader.result);

                reader.readAsDataURL(file);

            });
    }

    const product = {

        name:
            document.getElementById("name").value,

        price:
            Number(
                document.getElementById("price").value || 0
            ),

        oldPrice:
            Number(
                document.getElementById("oldPrice").value || 0
            ),

        image:

            image,

        category:
            document.getElementById("category").value

    };

    const id =
        document.getElementById("productId").value;

    if(id){

        product.id = id;
    }

    try{

        const res =
            await fetch(
                "/api/products",
                {
                    method:
                        id ? "PUT" : "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(product)
                }
            );

        const data =
            await res.json();

        if(!res.ok){

            throw new Error(
                data.error || "خطا"
            );
        }

        document.getElementById(
            "result"
        ).textContent =
            id
            ? "✅ محصول ویرایش شد"
            : "✅ محصول ذخیره شد";

        clearForm();

        loadProducts();

    }catch(error){

        document.getElementById(
            "result"
        ).textContent =
            "❌ " + error.message;
    }
}



// ==========================================
// ویرایش
// ==========================================

function editProduct(product){

    document.getElementById(
        "productId"
    ).value =
        product.id;

    document.getElementById(
        "name"
    ).value =
        product.name || "";

    document.getElementById(
        "price"
    ).value =
        product.price || "";

    document.getElementById(
        "oldPrice"
    ).value =
        product.oldPrice || "";

    document.getElementById(
        "category"
    ).value =
        product.category || "";

    document.getElementById(
        "image"
    ).value =
        product.image || "";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}



// ==========================================
// حذف
// ==========================================

async function deleteProduct(id){

    if(!confirm(
        "مطمئنی می‌خواهی این محصول حذف شود؟"
    )){
        return;
    }

    try{

        const res =
            await fetch(
                "/api/products",
                {
                    method:"DELETE",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({id})
                }
            );

        const data =
            await res.json();

        if(!res.ok){

            throw new Error(
                data.error || "خطا"
            );
        }

        loadProducts();

    }catch(error){

        alert(
            "❌ " + error.message
        );
    }
}



// ==========================================
// سفارش‌ها
// ==========================================

async function loadOrders(){

    const box =
        document.getElementById("orders");

    box.innerHTML =
        `<div class="loading">
            در حال دریافت سفارش‌ها...
        </div>`;

    try{

        const res =
            await fetch("/api/orders");

        const data =
            await res.json();

        if(!res.ok){

            throw new Error(
                data.error || "خطا"
            );
        }

        const orders =
            data.orders || [];

        document.getElementById(
            "ordersCount"
        ).textContent =
            orders.length.toLocaleString("fa-IR");


        // محاسبه فروش کل
        const totalSales =
            orders.reduce(
                (sum, order) =>
                    sum +
                    Number(
                        order.totalAmount || 0
                    ),
                0
            );

        document.getElementById(
            "salesTotal"
        ).textContent =
            totalSales.toLocaleString("fa-IR")
            + " تومان";


        if(!orders.length){

            box.innerHTML =
                `<div class="empty">
                    هنوز سفارشی ثبت نشده است.
                </div>`;

            return;
        }


        box.innerHTML =
            orders.map(
                (order,index) => `

                <div class="order">

                    <div class="order-header">

                        <div class="order-title">

                            📦 سفارش شماره
                            ${(
                                index + 1
                            ).toLocaleString("fa-IR")}

                        </div>

                        <div class="order-date">

                            🕐
                            ${formatDate(
                                order.createdAt
                            )}

                        </div>

                    </div>


                    <div class="order-info">

                        👤
                        <strong>نام:</strong>
                        ${escapeHtml(
                            order.name || "-"
                        )}

                        <br>

                        📱
                        <strong>موبایل:</strong>
                        ${escapeHtml(
                            order.mobile || "-"
                        )}

                        <br>

                        📮
                        <strong>کد پستی:</strong>
                        ${escapeHtml(
                            order.postalCode || "-"
                        )}

                        <br>

                        🏠
                        <strong>آدرس:</strong>
                        ${escapeHtml(
                            order.address || "-"
                        )}

                    </div>


                    <div class="order-products">

                        🛍️ <strong>محصولات</strong>

                        <br><br>

                        ${renderProducts(
                            order.products
                        )}

                    </div>


                    <div class="order-total">

                        💰 مبلغ کل:
                        ${Number(
                            order.totalAmount || 0
                        ).toLocaleString("fa-IR")}
                        تومان

                        <br>

                        🔢 تعداد:
                        ${Number(
                            order.quantity || 0
                        ).toLocaleString("fa-IR")}

                    </div>


                    <div class="status">

                        <strong>
                            وضعیت سفارش:
                        </strong>

                        <select
                            onchange="changeStatus(
                                '${order.id}',
                                this.value
                            )"
                        >

                            <option
                                value="new"
                                ${order.status === "new" ? "selected" : ""}
                            >
                                🟡 جدید
                            </option>

                            <option
                                value="preparing"
                                ${order.status === "preparing" ? "selected" : ""}
                            >
                                🔵 آماده‌سازی
                            </option>

                            <option
                                value="shipped"
                                ${order.status === "shipped" ? "selected" : ""}
                            >
                                🚚 ارسال شد
                            </option>

                            <option
                                value="delivered"
                                ${order.status === "delivered" ? "selected" : ""}
                            >
                                🟢 تحویل شد
                            </option>

                        </select>

                    </div>

                </div>

            `
            ).join("");


    }catch(error){

        box.innerHTML =
            `<div class="empty">
                ❌ ${escapeHtml(error.message)}
            </div>`;
    }
}



// ==========================================
// تغییر وضعیت
// ==========================================

async function changeStatus(id,status){

    try{

        const res =
            await fetch(
                "/api/orders",
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            id,
                            status
                        })
                }
            );

        const data =
            await res.json();

        if(!res.ok){

            throw new Error(
                data.error || "خطا"
            );
        }

        loadOrders();

    }catch(error){

        alert(
            "❌ " + error.message
        );

        loadOrders();
    }
}



// ==========================================
// محصولات سفارش
// ==========================================

function renderProducts(products){

    if(!Array.isArray(products)){
        return "محصولی ثبت نشده";
    }

    return products.map(
        product => `

        <div style="
            padding:7px 0;
            border-bottom:1px solid #eee;
        ">

            🛍️
            ${escapeHtml(
                product.name || "محصول"
            )}

            <br>

            🔢 تعداد:
            ${Number(
                product.quantity || 1
            ).toLocaleString("fa-IR")}

            <br>

            💰
            ${Number(
                product.price || 0
            ).toLocaleString("fa-IR")}
            تومان

        </div>

        `
    ).join("");
}



// ==========================================
// تاریخ
// ==========================================

function formatDate(value){

    if(!value){
        return "-";
    }

    const date =
        new Date(value);

    if(isNaN(date.getTime())){
        return "-";
    }

    return date.toLocaleString(
        "fa-IR",
        {
            year:"numeric",
            month:"2-digit",
            day:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}



// ==========================================
// پاک کردن فرم
// ==========================================

function clearForm(){

    document.getElementById(
        "productId"
    ).value = "";

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "price"
    ).value = "";

    document.getElementById(
        "oldPrice"
    ).value = "";

    document.getElementById(
        "category"
    ).value = "";

    document.getElementById(
        "image"
    ).value = "";

    document.getElementById(
        "imageFile"
    ).value = "";
}



// ==========================================
// امنیت نمایش متن
// ==========================================

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}



// ==========================================
// شروع
// ==========================================

loadProducts();
loadOrders();

</script>

</body>
</html>
